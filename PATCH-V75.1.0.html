};
let decorating=false,observer=null,cloudExtrasLoaded=false;
function workspace(){try{return clean(typeof getWorkspaceOwnerUid==='function'?getWorkspaceOwnerUid():'')||clean(globalThis.currentUser?.uid)||'local'}catch(_){return'local'}}
function storeKey(){return`scout_v750_recruitment_${workspace()}`}
function read(){try{const x=JSON.parse(localStorage.getItem(storeKey())||'null');return x&&typeof x==='object'?x:{entries:[],needs:[],dna:{}}}catch(_){return{entries:[],needs:[],dna:{}}}}
function write(s){s.updatedAt=Date.now();localStorage.setItem(storeKey(),JSON.stringify(s));return s}
function players(){try{return Array.isArray(db)?db:[]}catch(_){return[]}}
function player(id){return players().find(p=>String(p.id)===String(id))||null}
function teams(){try{const a=JSON.parse(localStorage.getItem('scout_v73142_tracked_teams')||'[]');return Array.isArray(a)?a.filter(x=>x&&clean(x.name)):[]}catch(_){return[]}}
function teamNames(){return teams().map(x=>clean(x.name)).filter(Boolean)}
function teamMeta(name){return teams().find(x=>fold(x.name)===fold(name))||{name}}
function activeClub(){const names=teamNames(),saved=localStorage.getItem('scout_v751_active_club')||localStorage.getItem('scout_v750_team')||localStorage.getItem('scout_v73140_team')||'';return names.find(x=>fold(x)===fold(saved))||names[0]||''}
function setActiveClub(team){if(!team)return;localStorage.setItem('scout_v751_active_club',team);localStorage.setItem('scout_v750_team',team);const old=$('v750-team-select');if(old&&old.value!==team){old.value=team;old.dispatchEvent(new Event('change',{bubbles:true}))}setTimeout(decorate,40)}
function posCode(v){const f=fold(typeof v==='string'?v:v?.pos);if(/goleir|keeper|\bgr\b/.test(f))return'GR';if(/zagueir|central|center.?back|centre.?back/.test(f))return'ZAG';if(/lateral|ala|full.?back|wing.?back/.test(f))return'LAT';if(/volante|medio defens|defensive mid|holding/.test(f))return'VOL';if(/meia|meio.?camp|midfield|armador/.test(f))return'MEI';if(/ponta|extremo|winger|atacante de lado/.test(f))return'EXT';if(/centroav|atacante central|striker|\bca\b/.test(f))return'CA';return''}
function ageOf(p){try{const a=typeof calculateAge==='function'?calculateAge(p?.dob,p?.age):Number(p?.age);return Number.isFinite(Number(a))?Number(a):''}catch(_){return Number(p?.age)||''}}
function evals(p){try{return(typeof getPlayerEvaluations==='function'?getPlayerEvaluations(p):p?.evaluations)||[]}catch(_){return Array.isArray(p?.evaluations)?p.evaluations:[]}}
function latestEval(p){return evals(p).slice().sort((a,b)=>Number(b.updatedAt||b.createdAt||Date.parse(b.matchDate||''))-Number(a.updatedAt||a.createdAt||Date.parse(a.matchDate||'')))[0]||null}
function evalTime(e){return Number(e?.updatedAt||e?.createdAt)||Date.parse(e?.matchDate||'')||0}
function freshness(p){const e=latestEval(p);if(!e)return{cls:'stale',label:'Sem observação',days:null,detail:'Nenhuma avaliação registrada'};const t=evalTime(e),days=t?Math.max(0,Math.floor((Date.now()-t)/86400000)):null,type=clean(e.observationType);let cls=days==null?'warn':days<=30?'fresh':days<=60?'warn':'stale';let label=days==null?'Data não informada':days===0?'Hoje':`${days}d`;if(type==='highlights')label=`HL • ${label}`,cls=cls==='fresh'?'warn':cls;return{cls,label,days,detail:type==='highlights'?'Última observação baseada em highlights':'Última observação registrada'}}
function consensus(p){const all=evals(p).filter(e=>clean(e.scoutName)||Number.isFinite(Number(e.overall)));const latestBy=new Map();all.sort((a,b)=>evalTime(b)-evalTime(a)).forEach(e=>{const name=clean(e.scoutName)||'Scout';if(!latestBy.has(name))latestBy.set(name,e)});const rows=[...latestBy.entries()].map(([name,e])=>({name,overall:Number(e.overall),e}));const nums=rows.map(x=>x.overall).filter(Number.isFinite);const avg=nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:null,range=nums.length>1?Math.max(...nums)-Math.min(...nums):0;return{scouts:rows.length,names:rows.map(x=>x.name),avg,range,rows}}
function coverage(p){const e=evals(p).slice().sort((a,b)=>evalTime(b)-evalTime(a)).find(x=>x.scoutPositionCoverage&&Number.isFinite(Number(x.scoutPositionCoverage.percent)));return e?{percent:Number(e.scoutPositionCoverage.percent)||0,missing:Array.isArray(e.scoutPositionCoverage.missing)?e.scoutPositionCoverage.missing:[],team:clean(e.scoutPositionCriteriaTeam)}:{percent:null,missing:[],team:''}}

function ensureClubbar(){const root=$('v750-root'),shell=root?.querySelector('.v750-shell'),tabs=root?.querySelector('.v750-tabs');if(!root||!shell||!tabs)return;let bar=$('v751-clubbar');if(!bar){bar=document.createElement('div');bar.id='v751-clubbar';bar.className='v751-clubbar';tabs.insertAdjacentElement('beforebegin',bar)}const names=teamNames(),club=activeClub(),m=teamMeta(club);bar.innerHTML=`<div><label>Clube / projeto ativo</label><select class="input-field" id="v751-club-select">${names.length?names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join(''):'<option value="">Crie uma equipe primeiro</option>'}</select></div><div class="v751-clubbar-meta"><strong>${esc(club||'Nenhum clube selecionado')}</strong>${esc([m.category,m.season,m.competition].filter(Boolean).join(' • ')||'Equipe acompanhada') }<br>Um login pode alternar entre páginas de clubes do mesmo workspace.</div><div class="v751-clubbar-actions"><button class="btn btn-outline" type="button" id="v751-home-club">🏠 Usar como início</button><button class="btn btn-outline" type="button" id="v751-new-club">＋ Outro clube</button></div>`;const sel=$('v751-club-select');if(sel&&club)sel.value=club;sel?.addEventListener('change',()=>{setActiveClub(sel.value)});$('v751-home-club').onclick=()=>{if(!activeClub())return;localStorage.setItem('scout_v751_home_club',activeClub());showToast?.('Página inicial definida',`${activeClub()} será aberto como contexto principal neste navegador.`,'success',5000)};$('v751-new-club').onclick=()=>{setTab('squad-tracking');setTimeout(()=>document.getElementById('v73142-new-team')?.click(),220)}}
function dnaSelected(team,pos){const s=read(),cfg=s.dna?.[team]?.[pos];return new Set(Array.isArray(cfg)?cfg:(CRITERIA[pos]||[]).map(x=>x[0]))}
function renderDnaInline(team){const pos=localStorage.getItem('scout_v751_dna_pos')||'VOL',selected=dnaSelected(team,pos);return`<div class="v751-dna-inline"><div class="v751-block-head"><div><h3>🧬 DNA do clube — critérios esperados</h3><p>Configure aqui o que é essencial para a posição. Durante a avaliação, o scout marca ✓ observado, △ ainda observar ou — não aplicável.</p></div></div><div class="v751-dna-controls"><div class="v750-field"><label>Posição</label><select class="input-field" id="v751-dna-pos">${Object.entries(POS).map(([k,v])=>`<option value="${k}" ${k===pos?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="v751-clubbar-meta"><strong>${esc(team)}</strong>O checklist mede cobertura da observação; não gera nota automática.</div><button class="btn btn-primary" type="button" id="v751-dna-save">Salvar DNA</button><button class="btn btn-outline" type="button" id="v751-dna-reset">Padrão</button></div><div class="v751-dna-grid" id="v751-dna-grid">${(CRITERIA[pos]||[]).map(([id,label,cat])=>`<label class="v751-dna-item"><input type="checkbox" data-id="${esc(id)}" ${selected.has(id)?'checked':''}><span><strong>${esc(label)}</strong><small>${esc(CAT[cat]||cat)}</small></span></label>`).join('')}</div></div>`}
function bindDna(team){const posSel=$('v751-dna-pos');if(!posSel)return;posSel.onchange=()=>{localStorage.setItem('scout_v751_dna_pos',posSel.value);const holder=$('v751-dna-holder');if(holder){holder.innerHTML=renderDnaInline(team);bindDna(team)}};$('v751-dna-save').onclick=async()=>{const s=read(),pos=posSel.value,ids=[...document.querySelectorAll('#v751-dna-grid input:checked')].map(x=>x.dataset.id);s.dna=s.dna||{};s.dna[team]=s.dna[team]||{};s.dna[team][pos]=ids;write(s);try{if(globalThis.currentUser&&typeof workspaceRootRef==='function')await workspaceRootRef().collection('recruitmentDna').doc('main').set({dna:s.dna,updatedAt:Date.now()},{merge:true})}catch(e){console.warn('V75.1 DNA cloud:',e)}showToast?.('DNA do clube salvo',`${team} • ${POS[pos]} • ${ids.length} critérios`,'success',5000)};$('v751-dna-reset').onclick=()=>{const s=read(),pos=posSel.value;if(s.dna?.[team])delete s.dna[team][pos];write(s);const holder=$('v751-dna-holder');holder.innerHTML=renderDnaInline(team);bindDna(team)}}
function shortlistMap(team){const s=read();s.shortlists=s.shortlists&&typeof s.shortlists==='object'?s.shortlists:{};return s.shortlists[team]&&typeof s.shortlists[team]==='object'?s.shortlists[team]:{}}
function saveShort(team,pid,slot){const s=read();s.shortlists=s.shortlists&&typeof s.shortlists==='object'?s.shortlists:{};s.shortlists[team]=s.shortlists[team]&&typeof s.shortlists[team]==='object'?s.shortlists[team]:{};if(!slot)delete s.shortlists[team][pid];else s.shortlists[team][pid]={slot,updatedAt:Date.now(),by:clean(globalThis.currentUser?.displayName||globalThis.currentUser?.email||'Scout')};write(s);cloudSaveExtras(s);renderClubExtras(team)}
async function cloudSaveExtras(s){if(!globalThis.currentUser||typeof workspaceRootRef!=='function')return;try{await workspaceRootRef().collection('recruitmentHub').doc('main').set({shortlists:s.shortlists||{},hubUpdatedAt:Date.now()},{merge:true})}catch(e){console.warn('V75.1 extras cloud:',e)}}
async function cloudLoadExtras(){if(cloudExtrasLoaded||!globalThis.currentUser||typeof workspaceRootRef!=='function')return;cloudExtrasLoaded=true;try{const d=await workspaceRootRef().collection('recruitmentHub').doc('main').get();if(d.exists){const s=read(),x=d.data()||{};if(x.shortlists)s.shortlists={...(s.shortlists||{}),...x.shortlists};write(s);setTimeout(decorate,20)}}catch(e){console.warn('V75.1 extras cloud load:',e)}}
function meetingPitch(team){const map=shortlistMap(team),items=Object.entries(map).map(([pid,v])=>({p:player(pid),...v})).filter(x=>x.p);const order={option1:0,option2:1,alternative:2,watch:3};const groups={GR:[],ZAG:[],LAT:[],VOL:[],MEI:[],EXT:[],CA:[]};items.sort((a,b)=>(order[a.slot]??9)-(order[b.slot]??9)).forEach(x=>{const pos=posCode(x.p);if(groups[pos])groups[pos].push(x)});return`<div class="v751-meeting-pitch"><div class="v751-mcircle"></div>${Object.entries(groups).map(([pos,arr])=>`<div class="v751-mpos v751-m-${pos}"><b>${esc(POS[pos])}</b>${arr.length?arr.slice(0,4).map(x=>`<span title="${esc(x.slot)}">${x.slot==='option1'?'①':x.slot==='option2'?'②':x.slot==='alternative'?'A':'M'} ${esc(x.p.name||'Atleta')}</span>`).join(''):'<span>—</span>'}</div>`).join('')}</div>`}
function renderMeeting(team,es){const map=shortlistMap(team),eligible=es.filter(e=>e.status!=='discarded'&&player(e.playerId)),selected=Object.entries(map).map(([pid,v])=>({pid,p:player(pid),...v})).filter(x=>x.p);return`<div class="v751-meeting"><div><div class="v751-short-controls"><div class="v750-field"><label>Candidato</label><select class="input-field" id="v751-short-player"><option value="">Selecione</option>${eligible.map(e=>{const p=player(e.playerId);return`<option value="${esc(String(p.id))}">${esc(p.name)} • ${esc(POS[posCode(p)]||p.pos||'')}</option>`}).join('')}</select></div><div class="v750-field"><label>Posição na shortlist</label><select class="input-field" id="v751-short-slot"><option value="option1">Opção 1</option><option value="option2">Opção 2</option><option value="alternative">Alternativa</option><option value="watch">Reserva de mercado</option></select></div><button class="btn btn-primary" type="button" id="v751-short-add">Adicionar</button></div><div class="v751-short-list">${selected.length?selected.map(x=>`<div class="v751-short-card"><div><strong>${esc(x.p.name||'Atleta')}</strong><small>${esc(POS[posCode(x.p)]||x.p.pos||'—')} • ${esc(x.p.club||'Clube n/i')}</small></div><div style="display:flex;gap:5px;align-items:center"><span class="v751-slot">${x.slot==='option1'?'Opção 1':x.slot==='option2'?'Opção 2':x.slot==='alternative'?'Alternativa':'Reserva'}</span><button class="btn btn-outline" type="button" onclick="v751RemoveShort('${esc(String(x.p.id))}')">×</button></div></div>`).join(''):'<div class="v751-empty">Ainda não há jogadores na shortlist da reunião.</div>'}</div></div>${meetingPitch(team)}</div>`}
function consensusRows(es){return es.map(e=>({e,p:player(e.playerId)})).filter(x=>x.p).map(x=>({...x,c:consensus(x.p),f:freshness(x.p),cv:coverage(x.p)})).filter(x=>x.c.scouts>=2);}
function needOptions(team){const s=read();return(s.needs||[]).filter(n=>n.team===team)}
function renderClubExtras(team){const host=$('v751-club-extras');if(!host||!team)return;const es=entries(team),rs=roster(team),needs=needOptions(team),cons=consensusRows(es);host.innerHTML=`<div class="v751-club-overview"><div class="v751-two"><section class="v751-block"><div class="v751-block-head"><div><h3>👥 Elenco atual do clube</h3><p>Jogadores já vinculados ao elenco. A ficha completa permanece única.</p></div><span class="v751-chip info">${rs.length} atleta(s)</span></div><div class="v751-list">${rs.length?rs.map(p=>playerCard(p,null)).join(''):'<div class="v751-empty">Nenhum atleta no elenco ativo.</div>'}</div></section><section class="v751-block"><div class="v751-block-head"><div><h3>🔎 Lista de scouting do ${esc(team)}</h3><p>Atletas escolhidos para este clube, independentemente do clube de origem.</p></div><span class="v751-chip info">${es.length} candidato(s)</span></div><div class="v751-list">${es.length?es.map(e=>playerCard(player(e.playerId),e)).join(''):'<div class="v751-empty">Adicione candidatos ao projeto do clube.</div>'}</div></section></div><section class="v751-block"><div class="v751-block-head"><div><h3>📺 Sala de reunião / Shortlist visual</h3><p>Opção 1, Opção 2 e Alternativa são escolhas manuais do scout. O sistema não cria ranking automático.</p></div></div>${renderMeeting(team,es)}</section><section class="v751-block"><div class="v751-block-head"><div><h3>🤝 Consenso dos scouts & validade da observação</h3><p>Mostra a última avaliação de cada scout e a dispersão das notas, sem substituir a leitura qualitativa.</p></div></div><div class="v751-consensus">${cons.length?`<table><thead><tr><th>Atleta</th><th>Scouts</th><th>Média</th><th>Diferença</th><th>Última observação</th><th>DNA</th></tr></thead><tbody>${cons.map(x=>`<tr><td><strong>${esc(x.p.name)}</strong><br><span style="color:var(--text-muted)">${esc(x.p.club||'Clube n/i')}</span></td><td>${esc(x.c.names.join(' • '))}</td><td>${x.c.avg==null?'—':x.c.avg.toFixed(1)}</td><td>${x.c.range?x.c.range.toFixed(1):'0,0'}</td><td><span class="v751-chip ${x.f.cls}">${esc(x.f.label)}</span></td><td>${x.cv.percent==null?'—':`${Math.round(x.cv.percent)}%`}</td></tr>`).join('')}</tbody></table>`:'<div class="v751-empty">O consenso aparecerá quando um candidato tiver avaliações registradas por pelo menos dois scouts.</div>'}</div></section><section class="v751-block"><div class="v751-block-head"><div><h3>🎯 DNA & necessidade dentro da página do clube</h3><p>O DNA não tem mais uma página própria. Ele fica aqui para configuração e dentro da avaliação do atleta para marcação observacional.</p></div></div><div id="v751-dna-holder">${renderDnaInline(team)}</div></section><section class="v751-block"><div class="v751-block-head"><div><h3>📄 Relatório de mercado por necessidade</h3><p>Gera um PDF com necessidade, candidatos vinculados, status humano, validade da observação, consenso e cobertura do DNA.</p></div></div><div class="v751-report-row"><div><label>Necessidade</label><select class="input-field" id="v751-report-need"><option value="">Selecione</option>${needs.map(n=>`<option value="${esc(n.id)}">${esc(POS[n.position]||n.position)}${n.title?` • ${esc(n.title)}`:''} • ${Number(n.slots)||1} vaga(s)</option>`).join('')}</select></div><button class="btn btn-primary" type="button" id="v751-report-generate">📄 Gerar relatório de mercado</button></div></section></div>`;bindDna(team);$('v751-short-add').onclick=()=>{const pid=$('v751-short-player').value,slot=$('v751-short-slot').value;if(!pid)return alert('Selecione um candidato.');saveShort(team,pid,slot)};$('v751-report-generate').onclick=()=>generateNeedPdf(team,$('v751-report-need').value)}
function ensureTeamExtras(){const body=$('v750-team-body'),team=activeClub()||$('v750-team-select')?.value;if(!body||!team)return;let ex=$('v751-club-extras');if(!ex){ex=document.createElement('div');ex.id='v751-club-extras';body.appendChild(ex)}renderClubExtras(team)}
async function generateNeedPdf(team,id){const s=read(),n=(s.needs||[]).find(x=>x.id===id&&x.team===team);if(!n)return alert('Selecione uma necessidade.');if(!window.jspdf?.jsPDF)return alert('Gerador de PDF indisponível.');const cand=(s.entries||[]).filter(e=>e.team===team&&e.needId===id&&player(e.playerId));const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4',compress:true}),W=210,H=297,m=14,w=W-m*2;const lines=(t,ww=w)=>doc.splitTextToSize(String(t||''),ww);const header=(title)=>{doc.setFillColor(5,24,47);doc.rect(0,0,W,30,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text(String(title).slice(0,80),m,15);doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.text(`${team} • Recruitment Hub • ${new Date().toLocaleDateString('pt-BR')}`,m,23)};const footer=()=>{doc.setTextColor(100,116,139);doc.setFontSize(6);doc.text('Status, shortlist e encaminhamentos são confirmações humanas. O sistema não seleciona automaticamente o melhor atleta.',m,H-8)};header(`RELATÓRIO DE MERCADO • ${POS[n.position]||n.position}`);let y=40;doc.setTextColor(15,23,42);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(lines(n.title||`${POS[n.position]||n.position} — necessidade do elenco`),m,y);y+=10;doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text(lines(`${Number(n.slots)||1} vaga(s) • prioridade ${n.priority||'normal'}${n.subprofile?` • perfil ${n.subprofile}`:''}`),m,y);y+=7;if(n.notes){const l=lines(n.notes);doc.text(l,m,y);y+=l.length*4+4}doc.setDrawColor(226,232,240);doc.line(m,y,W-m,y);y+=8;if(!cand.length){doc.text('Nenhum candidato vinculado a esta necessidade.',m,y)}else for(const e of cand){const p=player(e.playerId),fr=freshness(p),co=consensus(p),cv=coverage(p),age=ageOf(p);if(y>250){footer();doc.addPage();header(`CANDIDATOS • ${POS[n.position]||n.position}`);y=40}doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(15,23,42);doc.text(`${p.name||'Atleta'} • ${statusLabel(e.status)}`,m,y);y+=5;doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(71,85,105);const meta=[POS[posCode(p)]||p.pos,age!==''?`${age} anos`:'',p.club||'Clube n/i'].filter(Boolean).join(' • ');doc.text(lines(meta),m,y);y+=5;doc.text(lines(`Observação: ${fr.label} • Scouts: ${co.scouts}${co.avg!=null?` • média ${co.avg.toFixed(1)}`:''}${co.range?` • diferença ${co.range.toFixed(1)}`:''} • DNA: ${cv.percent==null?'—':Math.round(cv.percent)+'%'}`),m,y);y+=5;if(e.nextAction){const l=lines(`Próxima ação: ${e.nextAction}`);doc.text(l,m,y);y+=l.length*3.5}const le=latestEval(p),op=clean(le?.scoutNarrativeSelected||le?.notes);if(op){const l=lines(`Parecer: ${op}`,w).slice(0,4);doc.text(l,m,y);y+=l.length*3.5}y+=5;doc.setDrawColor(226,232,240);doc.line(m,y,W-m,y);y+=7}footer();const safe=team.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'_');doc.save(`mercado_${safe}_${n.position}_${new Date().toISOString().slice(0,10)}.pdf`);showToast?.('Relatório de mercado criado',`${team} • ${POS[n.position]||n.position} • ${cand.length} candidato(s)`,'success',6500)}
function openPlayer(id,analyze=false){const p=player(id);if(!p)return;try{currentId=String(id);updateGlobalSelect?.();setTab('report');loadPlayer?.(String(id));if(analyze)setTimeout(()=>{setProfileTab?.('evaluations');openEvaluationModal?.()},220)}catch(e){console.error(e)}}
function decorateGeneral(){const tab=document.querySelector('.v750-tab[data-mode="general"]');if(tab)tab.textContent='🌐 Pool geral / todos os atletas';const sec=$('v750-general');if(sec&&!sec.querySelector('.v751-global-note')){const n=document.createElement('div');n.className='v751-block v751-global-note';n.style.marginBottom='12px';n.innerHTML='<div class="v751-block-head"><div><h3>🌐 Pool geral de scouting</h3><p>Este painel cresce com todos os atletas acompanhados. A relação com cada clube fica separada, então o mesmo atleta pode estar em projetos diferentes sem duplicar a ficha.</p></div></div>';sec.insertBefore(n,sec.firstChild)}}
function decorate(){if(decorating)return;const root=$('v750-root');if(!root||$('tab-recruitment-board')?.classList.contains('hidden'))return;decorating=true;try{const teamTab0=root.querySelector('.v750-tab[data-mode="team"]');if(teamTab0&&!sessionStorage.getItem('scout_v751_team_defaulted')){sessionStorage.setItem('scout_v751_team_defaulted','1');if(!teamTab0.classList.contains('active'))setTimeout(()=>teamTab0.click(),0)}const nav=$('nav-recruitment-board')?.querySelector('.sidebar-label');if(nav)nav.textContent='Clube & Mercado';const hero=root.querySelector('.v750-hero h2');if(hero)hero.textContent='🏟️ Centro do Clube & Mercado';const heroP=root.querySelector('.v750-hero p');if(heroP)heroP.textContent='Uma ficha por atleta. Cada clube mantém sua própria lista de scouting, necessidades, shortlist e decisões; o clube de origem continua preservado na ficha.';ensureClubbar();decorateGeneral();const teamTab=root.querySelector('.v750-tab[data-mode="team"]');if(teamTab)teamTab.textContent='🏟️ Página do clube';const teamSel=$('v750-team-select'),club=activeClub();if(teamSel&&club&&teamSel.value!==club){teamSel.value=club;teamSel.dispatchEvent(new Event('change',{bubbles:true}))}ensureTeamExtras();branding()}finally{decorating=false}}
function branding(){try{document.title='Scout Intelligence 1.5.1.0 — V75.1.0 CLUB WORKSPACE & RECRUITMENT HUB';const v=document.querySelector('.sidebar-brand-version');if(v)v.textContent='V75.1.0 • Scout Intelligence 1.5.1.0';const sys=$('system-release-status');if(sys)sys.textContent='V75.1.0 • Clube & Mercado + DNA integrado';const road=$('nav-roadmap')?.querySelector('.sidebar-label');if(road)road.textContent='V75.1 • Club Workspace';const gate=$('v73144-stable-card');if(gate){const h=gate.querySelector('h3');if(h)h.textContent='🏁 V75.1.0 — Gate de homologação';const b=$('v73144-promote');if(b)b.textContent='Promover V75.1.0 após homologação'}}catch(_){}}
window.v751OpenPlayer=id=>openPlayer(id,false);window.v751Analyze=id=>openPlayer(id,true);window.v751RemoveShort=id=>{const team=activeClub();if(team)saveShort(team,String(id),'')};window.v751GenerateNeedPdf=generateNeedPdf;
const baseRender=window.v750Render;if(typeof baseRender==='function'&&!baseRender.__v751){const wrap=function(){const r=baseRender.apply(this,arguments);setTimeout(decorate,30);return r};wrap.__v751=true;window.v750Render=wrap}
const baseSetTab=window.setTab;if(typeof baseSetTab==='function'&&!baseSetTab.__v751){const wrap=function(name){const r=baseSetTab.apply(this,arguments);if(name==='recruitment-board')setTimeout(()=>{try{window.v750Render?.();const t=document.querySelector('#v750-root .v750-tab[data-mode="team"]');if(t&&!t.classList.contains('active'))t.click();decorate();cloudLoadExtras()}catch(e){console.warn('V75.1 open hub:',e)}},120);return r};wrap.__v751=true;window.setTab=wrap}
function installObserver(){const root=$('v750-root');if(!root||observer)return;let timer=0;observer=new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(decorate,80)});observer.observe(root,{childList:true,subtree:true})}
function autoStart(){if(sessionStorage.getItem('scout_v751_autostart'))return;const club=localStorage.getItem('scout_v751_home_club');if(!club)return;sessionStorage.setItem('scout_v751_autostart','1');setTimeout(()=>{if(globalThis.currentUser&&!globalThis.isViewMode){setActiveClub(club);setTab('recruitment-board')}},1800)}
try{if(typeof HOMOLOGATION_ITEMS!=='undefined'&&!HOMOLOGATION_ITEMS.some(i=>i.id==='club-workspace-v751'))HOMOLOGATION_ITEMS.push({id:'club-workspace-v751',title:'Clube & Mercado V75.1',detail:'Abrir página do clube, conferir elenco + scouting, shortlist, consenso, validade, DNA integrado e relatório por necessidade.'})}catch(_){ }
[250,900,1800,3200].forEach(ms=>setTimeout(()=>{branding();installObserver();if(!$('tab-recruitment-board')?.classList.contains('hidden'))decorate();autoStart()},ms));setInterval(branding,600);
})();
</script>
