:3px 7px;border-radius:999px;background:rgba(16,185,129,.10);color:#047857;font-size:.44rem;font-weight:900;margin-left:4px}.v754-compare{margin-top:8px;border-top:1px dashed var(--border);padding-top:7px}.v754-compare-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;font-size:.46rem;padding:4px 0}.v754-compare-row span{color:var(--text-muted)}

let decorating=false,lastSuggestion=null;
function workspace(){try{return clean(typeof getWorkspaceOwnerUid==='function'?getWorkspaceOwnerUid():'')||clean(globalThis.currentUser?.uid)||'local'}catch(_){return'local'}}
function key(){return`scout_v750_recruitment_${workspace()}`}
function read(){try{return JSON.parse(localStorage.getItem(key())||'{}')||{}}catch(_){return{}}}
function write(s){s.updatedAt=Date.now();localStorage.setItem(key(),JSON.stringify(s));return s}
function players(){try{return Array.isArray(db)?db:[]}catch(_){return[]}}
function player(id){return players().find(p=>String(p.id)===String(id))||null}
function teams(){try{const a=JSON.parse(localStorage.getItem('scout_v73142_tracked_teams')||'[]');return Array.isArray(a)?a.filter(x=>x&&clean(x.name)):[]}catch(_){return[]}}
function activeClub(){const names=teams().map(x=>clean(x.name)),saved=localStorage.getItem('scout_v751_active_club')||localStorage.getItem('scout_v750_team')||localStorage.getItem('scout_v73140_team')||'';return names.find(x=>fold(x)===fold(saved))||names[0]||''}
function posCode(v){const f=fold(typeof v==='string'?v:v?.pos);if(/goleir|keeper|\bgr\b/.test(f))return'GR';if(/zagueir|central|center.?back|centre.?back/.test(f))return'ZAG';if(/lateral|ala|full.?back|wing.?back/.test(f))return'LAT';if(/volante|medio defens|defensive mid|holding/.test(f))return'VOL';if(/meia|meio.?camp|midfield|armador/.test(f))return'MEI';if(/ponta|extremo|winger|atacante de lado/.test(f))return'EXT';if(/centroav|atacante central|striker|\bca\b/.test(f))return'CA';return''}
function canPlay(p,pos){if(posCode(p)===pos)return true;return(Array.isArray(p?.secPos)?p.secPos:[]).some(x=>posCode(String(x))===pos)}
function roster(team){return players().filter(p=>fold(p.squadTeam)===fold(team)&&(fold(p.status)==='elenco'||['roster','loan','contracted'].includes(fold(p.squadMembershipStatus))))}
function entries(team){return(read().entries||[]).filter(e=>e.team===team&&player(e.playerId)&&e.status!=='discarded')}
function pool(team,pos){const m=new Map();roster(team).forEach(p=>{if(canPlay(p,pos))m.set(String(p.id),p)});entries(team).forEach(e=>{const p=player(e.playerId);if(p&&canPlay(p,pos))m.set(String(p.id),p)});return[...m.values()]}
function avgGroup(p,g){const a=Object.values(p?.stats?.[g]||{}).map(Number).filter(Number.isFinite);return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function evals(p){try{return(typeof getPlayerEvaluations==='function'?getPlayerEvaluations(p):p?.evaluations)||[]}catch(_){return[]}}
function coverage(p,team){const e=evals(p).slice().sort((a,b)=>Number(b.updatedAt||b.createdAt||0)-Number(a.updatedAt||a.createdAt||0)).find(x=>x.scoutPositionCoverage&&(!team||!x.scoutPositionCriteriaTeam||fold(x.scoutPositionCriteriaTeam)===fold(team)));return e&&Number.isFinite(Number(e.scoutPositionCoverage?.percent))?Number(e.scoutPositionCoverage.percent):0}
function confidence(p){try{return Math.max(0,Math.min(100,Number(calculateDataConfidence?.(p))||0))}catch(_){return 0}}
function rating(p){try{return Math.max(0,Math.min(100,(Number(calculateRating?.(p?.stats||{}))||0)*10))}catch(_){return 0}}
function baseFit(p,pos){try{if(typeof shadowScore==='function')return Math.max(0,Math.min(100,Number(shadowScore(p,pos,'tactical'))*10));if(typeof v7297AutoTacticalFit==='function')return Number(v7297AutoTacticalFit(p,p.stats,pos))||0}catch(_){}return Number(p?.tacticalFit)||0}
function formAffinity(form,pos,p){let a=70;const off=avgGroup(p,'off'),def=avgGroup(p,'def'),phy=avgGroup(p,'phy');if(form==='4-3-3'){if(pos==='EXT')a+=8;if(['VOL','MEI'].includes(pos))a+=6;if(pos==='LAT')a+=3;if(pos==='CA')a+=2}if(form==='4-2-3-1'){if(['VOL','MEI','EXT'].includes(pos))a+=7;if(pos==='CA')a+=3}if(form==='3-4-3'){if(pos==='LAT')a+=10;if(pos==='ZAG')a+=6;if(pos==='EXT')a+=5;if(pos==='LAT')a+=(phy+off-def)*1.1}if(form==='4-4-2'){if(pos==='CA')a+=9;if(pos==='EXT')a+=6;if(pos==='LAT')a+=4;if(pos==='CA')a+=(off+phy-10)*1.0}if(form==='3-5-2'){if(pos==='LAT')a+=10;if(['ZAG','VOL','MEI','CA'].includes(pos))a+=5;if(pos==='LAT')a+=(phy+off-def)*1.1}if(form==='4-1-4-1'){if(pos==='VOL')a+=10;if(['MEI','EXT'].includes(pos))a+=6;if(pos==='VOL')a+=(def+phy-10)*.9}if(form==='5-3-2'){if(pos==='ZAG')a+=9;if(pos==='LAT')a+=7;if(pos==='CA')a+=5;if(pos==='ZAG')a+=(def+phy-10)*.9}return Math.max(45,Math.min(100,a))}
function systemScore(p,pos,form,team){const bf=baseFit(p,pos),rt=rating(p),cf=confidence(p),cv=coverage(p,team),fa=formAffinity(form,pos,p);let score=bf*.46+rt*.20+cf*.12+cv*.10+fa*.12;if(posCode(p)!==pos)score-=3;return Math.round(Math.max(0,Math.min(100,score)))}
function reason(p,pos,form,team){const off=avgGroup(p,'off'),def=avgGroup(p,'def'),phy=avgGroup(p,'phy'),cv=coverage(p,team),parts=[];const groups=[['técnico/ofensivo',off],['defensivo',def],['físico',phy]].filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);if(groups[0])parts.push(`${groups[0][0]} ${groups[0][1].toFixed(1)}`);if(cv)parts.push(`cobertura ${Math.round(cv)}%`);if(form==='3-4-3'||form==='3-5-2')parts.push(pos==='LAT'?'função de ala valorizada':'linha de 3 considerada');else if(form==='4-4-2'&&pos==='CA')parts.push('dupla de ataque considerada');else if(form==='4-1-4-1'&&pos==='VOL')parts.push('volante único valorizado');else if(form==='5-3-2'&&pos==='ZAG')parts.push('proteção central valorizada');return parts.slice(0,3).join(' • ')||'dados ainda limitados'}
function suggestion(team,form){const slots=FORMS[form]||FORMS['4-3-3'],used=new Set(),rows=[];for(const slot of slots){const ranked=pool(team,slot.pos).map(p=>({p,score:systemScore(p,slot.pos,form,team)})).sort((a,b)=>b.score-a.score||String(a.p.name||'').localeCompare(String(b.p.name||''),'pt-BR'));const pick=ranked.find(x=>!used.has(String(x.p.id)))||null;if(pick)used.add(String(pick.p.id));rows.push({...slot,pick,alternatives:ranked.filter(x=>!pick||String(x.p.id)!==String(pick.p.id)).slice(0,2)})}return{team,form,rows,at:Date.now()}}

function renderAdvisor(){const team=activeClub(),sel=$('v753-form-select');if(!team||!sel)return;const form=sel.value||'4-3-3',proj=$('v753-command')?.querySelector('.v753-projection-grid');if(!proj)return;let box=$('v754-advisor');if(!box){box=document.createElement('section');box.id='v754-advisor';box.className='v754-advisor';proj.parentElement.appendChild(box)}lastSuggestion=suggestion(team,form);const rows=lastSuggestion.rows;box.innerHTML=`<div class="v754-advisor-head"><div><h4>✨ Assistente de sistema • ${esc(form)}</h4><p>Ao mudar o sistema, o Scout recalcula quais atletas apresentam maior aderência aos dados disponíveis para cada função. É uma sugestão explicável: não muda a escalação, o status ou a decisão sem sua confirmação.</p></div><div class="v754-advisor-actions"><button class="btn btn-primary" type="button" id="v754-apply">Aplicar XI sugerido</button><button class="btn btn-outline" type="button" id="v754-refresh">Recalcular</button></div></div><div class="v754-summary">${rows.map(r=>{const p=r.pick?.p,score=r.pick?.score||0,alts=r.alternatives||[];return`<div class="v754-suggest"><div class="v754-suggest-top">${p?avatar(p):'<span class="v754-suggest-avatar">?</span>'}<div style="min-width:0"><b>${esc(r.label)} • ${esc(p?.name||'Sem opção')}</b><small>${p?`${esc(p.club||'sem clube')} • ${esc(POS[r.pos]||r.pos)}`:'Nenhum atleta compatível'}</small></div></div>${p?`<span class="v754-score ${score<70?'low':''}">Encaixe ${score}%</span><div class="v754-reason">${esc(reason(p,r.pos,form,team))}</div>${alts.length?`<div class="v754-compare">${alts.map(a=>`<div class="v754-compare-row"><span>${esc(a.p.name||'Atleta')}</span><b>${a.score}%</b></div>`).join('')}</div>`:''}`:''}</div>`}).join('')}</div><div class="v754-system-note">O índice combina atributos cadastrados, encaixe tático existente, avaliações, confiança dos dados, cobertura observacional e exigências relativas do sistema. “Mais apropriado” significa maior aderência ao recorte disponível — não “melhor jogador” em termos absolutos.</div>`;$('v754-refresh').onclick=()=>renderAdvisor();$('v754-apply').onclick=applySuggestion;upgradePitch()}
function applySuggestion(){if(!lastSuggestion)return;const names=lastSuggestion.rows.filter(r=>r.pick).map(r=>r.pick.p.name);if(!names.length)return alert('Não há atletas compatíveis suficientes para sugerir um XI.');if(!confirm(`Aplicar a sugestão de ${lastSuggestion.form} ao campinho de projeção?\n\nIsso altera apenas a projeção visual; não muda elenco, status ou contratação.`))return;const s=read();s.clubProjections=s.clubProjections||{};const slots={};lastSuggestion.rows.forEach(r=>{if(r.pick)slots[r.id]=String(r.pick.p.id)});s.clubProjections[lastSuggestion.team]={...(s.clubProjections[lastSuggestion.team]||{}),formation:lastSuggestion.form,slots,updatedAt:Date.now(),suggestedBy:'system-fit-v754'};write(s);showToast?.('XI sugerido aplicado',`${lastSuggestion.team} • ${lastSuggestion.form} • projeção visual atualizada.`,'success',5200);try{window.v750Render?.()}catch(_){};setTimeout(decorate,260)}
function upgradePitch(){const team=activeClub(),form=$('v753-form-select')?.value||'4-3-3';document.querySelectorAll('#v753-command .v753-slot').forEach(slot=>{const sel=slot.querySelector('select'),p=player(sel?.value);slot.querySelector('.v754-pitch-photo')?.remove();slot.querySelector('.v754-system-chip')?.remove();slot.classList.toggle('v754-has-photo',!!p);if(!p)return;const src=clean(p.photo);if(src){const img=document.createElement('img');img.className='v754-pitch-photo';img.src=src;img.alt=p.name||'Atleta';slot.insertBefore(img,slot.firstChild)}const chip=document.createElement('span');chip.className='v754-system-chip';chip.textContent=`Sistema ${systemScore(p,sel?.dataset.pos||posCode(p),form,team)}%`;const lab=slot.querySelector('.v753-slot-label');lab?.appendChild(chip)})}
