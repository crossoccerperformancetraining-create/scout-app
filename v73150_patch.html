<style id="v73150-daily-plan-style">
.v73150-card{background:linear-gradient(145deg,#f8fbff,#f1f5f9);border:1px solid #bfdbfe;border-radius:17px;padding:16px;box-shadow:0 8px 26px rgba(15,23,42,.05);min-width:0}
.v73150-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}.v73150-head h3{margin:0;color:var(--text-main);font-size:.96rem}.v73150-head p{margin:4px 0 0;color:var(--text-muted);font-size:.66rem;line-height:1.45}.v73150-actions{display:flex;gap:7px;flex-wrap:wrap}
.v73150-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:13px 0 10px}.v73150-kpi{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px}.v73150-kpi span{display:block;font-size:.53rem;font-weight:850;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)}.v73150-kpi strong{display:block;margin-top:4px;font-size:1.05rem;color:var(--text-main)}
.v73150-progress{margin:8px 0 12px}.v73150-progress-head{display:flex;justify-content:space-between;gap:8px;font-size:.61rem;color:var(--text-muted);margin-bottom:5px}.v73150-track{height:8px;border-radius:999px;background:#e2e8f0;overflow:hidden}.v73150-fill{height:100%;background:#22c55e;border-radius:999px;transition:width .2s ease}
.v73150-planner{display:grid;grid-template-columns:150px minmax(200px,1.4fr) 170px 160px auto auto;gap:7px;margin-bottom:12px;align-items:center}.v73150-planner .input-field{margin:0!important;padding:8px 9px!important;font-size:.63rem!important;min-width:0}.v73150-planner .btn{white-space:nowrap}
.v73150-status{font-size:.58rem;color:#475569;margin:-3px 0 10px;min-height:16px}.v73150-status.ok{color:#166534}.v73150-status.warn{color:#9a3412}
.v73150-list{display:grid;gap:8px}.v73150-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:10px}.v73150-row.done{border-color:#bbf7d0;background:#f0fdf4}.v73150-row.high{box-shadow:inset 3px 0 #dc2626}.v73150-row.low{box-shadow:inset 3px 0 #94a3b8}.v73150-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--bg);border:1px solid var(--border)}.v73150-copy{min-width:0}.v73150-copy strong{display:block;font-size:.75rem;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v73150-copy small{display:block;margin-top:2px;font-size:.6rem;color:var(--text-muted);line-height:1.35}.v73150-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.v73150-chip{font-size:.51rem;font-weight:850;border-radius:999px;padding:3px 6px;background:#e0f2fe;color:#075985}.v73150-chip.ok{background:#dcfce7;color:#166534}.v73150-chip.warn{background:#ffedd5;color:#9a3412}.v73150-chip.bad{background:#fee2e2;color:#991b1b}.v73150-chip.pri{background:#ede9fe;color:#5b21b6}.v73150-row-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.v73150-row-actions .btn{padding:6px 8px;font-size:.56rem}
.v73150-empty{border:1px dashed #bfdbfe;background:#eff6ff;border-radius:12px;padding:15px;text-align:center;color:#475569;font-size:.67rem}.v73150-closed{margin-bottom:10px;border:1px solid #bbf7d0;background:#f0fdf4;border-radius:10px;padding:8px 10px;font-size:.61rem;color:#166534;font-weight:800;display:none}.v73150-closed.show{display:block}
@media(max-width:1100px){.v73150-planner{grid-template-columns:1fr 1fr}.v73150-planner{grid-template-columns:1fr 1fr 1fr}.v73150-planner .btn{width:100%}}
@media(max-width:720px){.v73150-kpis{grid-template-columns:1fr 1fr}.v73150-planner{grid-template-columns:1fr}.v73150-row{grid-template-columns:42px minmax(0,1fr)}.v73150-row-actions{grid-column:2;justify-content:flex-start}.v73150-head .v73150-actions{width:100%}.v73150-head .v73150-actions .btn{flex:1}}
</style>
<script id="v73150-daily-plan-script">
(()=>{
'use strict';
const VER50='V73.1.50', BUILD50='2026.09.09-PLANEJAMENTO-DIARIO-SCOUTING';
const $50=id=>document.getElementById(id), clean50=v=>String(v??'').trim(), fold50=v=>clean50(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc50=v=>{try{return typeof escapeHTML==='function'?escapeHTML(v):clean50(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}catch(_){return clean50(v)}};
const POS50={ALL:'Todas as posições',GR:'Goleiro',ZAG:'Zagueiro',LAT:'Lateral',VOL:'Volante',MEI:'Meia',EXT:'Atacante de lado',CA:'Centroavante'};
const REASONS50={reavaliacao:'Reavaliação',jogo:'Jogo recente',comparacao:'Comparação',contratacao:'Possível contratação',evolucao:'Acompanhar evolução',outro:'Outro'};
function date50(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function owner50(){try{return typeof getWorkspaceOwnerUid==='function'?(getWorkspaceOwnerUid()||'local'):'local'}catch(_){return'local'}}
function key50(day=date50()){return `scout_v73150_daily_plan_${owner50()}_${day}`}
function read50(day=date50()){try{const x=JSON.parse(localStorage.getItem(key50(day))||'null');return x&&Array.isArray(x.items)?x:{version:1,date:day,items:[],deferred:[],createdAt:Date.now(),updatedAt:Date.now(),closedAt:null}}catch(_){return{version:1,date:day,items:[],deferred:[],createdAt:Date.now(),updatedAt:Date.now(),closedAt:null}}}
function write50(plan){plan.version=1;plan.updatedAt=Date.now();localStorage.setItem(key50(plan.date),JSON.stringify(plan));cloudSave50(plan);return plan}
async function cloudSave50(plan){try{if(typeof currentUser==='undefined'||!currentUser||typeof workspaceRootRef!=='function')return;await workspaceRootRef().collection('dailyAnalysisPlans').doc(plan.date).set({version:1,date:plan.date,items:plan.items,deferred:plan.deferred||[],closedAt:plan.closedAt||null,updatedAt:Date.now(),updatedBy:currentUser.uid||''},{merge:true})}catch(_){/* local permanece fonte segura */}}
async function cloudHydrate50(){try{const p=read50();if(p.items.length||p.closedAt||typeof currentUser==='undefined'||!currentUser||typeof workspaceRootRef!=='function')return;const snap=await workspaceRootRef().collection('dailyAnalysisPlans').doc(date50()).get();if(snap?.exists){const d=snap.data()||{};if(Array.isArray(d.items)){write50({...p,...d,date:date50()});render50()}}}catch(_){}}
function players50(){try{return Array.isArray(db)?db:[]}catch(_){return[]}}
function player50(id){return players50().find(p=>String(p.id)===String(id))}
function pos50(p){const raw=clean50(p?.pos||p?.position||'').toUpperCase();if(['GR','ZAG','LAT','VOL','MEI','EXT','CA'].includes(raw))return raw;const f=fold50(raw);if(/gol|keeper/.test(f))return'GR';if(/zag|zague|central defender/.test(f))return'ZAG';if(/lat|ala|fullback/.test(f))return'LAT';if(/vol|defensive mid/.test(f))return'VOL';if(/mei|armador|attacking mid/.test(f))return'MEI';if(/ponta|extremo|wing/.test(f))return'EXT';if(/centroav|striker|atacante central/.test(f))return'CA';return raw||'—'}
function evals50(p){try{return typeof getPlayerEvaluations==='function'?(getPlayerEvaluations(p)||[]):(Array.isArray(p?.evaluations)?p.evaluations:[])}catch(_){return[]}}
function evalTs50(e){const n=Number(e?.updatedAt||e?.createdAt||e?.evaluatedAt);if(n)return n;const x=Date.parse(e?.matchDate||e?.date||'');return Number.isFinite(x)?x:0}
function done50(p){const d=new Date();d.setHours(0,0,0,0);const s=d.getTime(),e=s+86400000-1;return evals50(p).some(x=>{const t=evalTs50(x);return t>=s&&t<=e})}
function lastEval50(p){return Math.max(0,...evals50(p).map(evalTs50))}
function links50(p){try{const x=typeof v7312AccessLinks==='function'?v7312AccessLinks(p,{}):{};return{x,full:!!x?.full,hl:!!x?.highlights}}catch(_){return{x:{},full:false,hl:false}}}
function source50(p){try{return (typeof getPlayerDataSources==='function'?(getPlayerDataSources(p)||[]):[]).some(s=>s?.active&&s?.url)}catch(_){return false}}
function material50(p){const l=links50(p),src=source50(p);return{full:l.full,hl:l.hl,src,video:l.full||l.hl}}
function image50(p){return clean50(p?.photo||p?.image||p?.avatar||'')}
function priorityLabel50(v){return v==='high'?'Alta':v==='low'?'Baixa':'Normal'}
function reasonLabel50(v){return REASONS50[v]||clean50(v)||'Análise'}
function score50(p){let s=0;const last=lastEval50(p),ageDays=last?Math.floor((Date.now()-last)/86400000):9999,m=material50(p);if(!last)s+=100;else if(ageDays>60)s+=70;else if(ageDays>30)s+=45;else s+=Math.max(0,30-ageDays);if(m.video)s+=18;if(m.full)s+=6;if(m.src)s+=5;try{const st=fold50(p?.status);if(/monitor|radar|elenco/.test(st))s+=8;const dec=fold50(p?.decision);if(/aprofund|monitor/.test(dec))s+=6}catch(_){}return s}
function candidate50(pos){const plan=read50(),used=new Set(plan.items.map(i=>String(i.playerId)));return players50().filter(p=>!used.has(String(p.id))&&(pos==='ALL'||pos50(p)===pos)&&!done50(p)).sort((a,b)=>score50(b)-score50(a)||String(a.name||'').localeCompare(String(b.name||''),'pt-BR'))[0]||null}
function fillPlayers50(){const pos=$50('v73150-pos')?.value||'ALL',sel=$50('v73150-player');if(!sel)return;const arr=players50().filter(p=>pos==='ALL'||pos50(p)===pos).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'pt-BR'));const cur=sel.value;sel.innerHTML='<option value="">Selecione o atleta...</option>'+arr.map(p=>`<option value="${esc50(p.id)}">${esc50(p.name||'Atleta')} • ${esc50(POS50[pos50(p)]||pos50(p))} • ${esc50(p.club||'sem clube')}</option>`).join('');if(arr.some(p=>String(p.id)===String(cur)))sel.value=cur}
function suggest50(){const pos=$50('v73150-pos')?.value||'ALL',p=candidate50(pos);if(!p){status50('Nenhum candidato pendente encontrado para este filtro.','warn');return}const sel=$50('v73150-player');if(sel){sel.value=String(p.id);status50(`Sugestão: ${p.name}. Prioridade calculada por tempo sem avaliação e material disponível.`,'ok')}}
function add50(){const id=$50('v73150-player')?.value,p=player50(id);if(!p){status50('Selecione um atleta.','warn');return}const plan=read50();if(plan.items.some(i=>String(i.playerId)===String(id))){status50('Este atleta já está no plano de hoje.','warn');return}plan.closedAt=null;plan.items.push({id:`p-${Date.now()}-${Math.random().toString(16).slice(2,6)}`,playerId:String(id),position:pos50(p),reason:$50('v73150-reason')?.value||'reavaliacao',priority:$50('v73150-priority')?.value||'normal',addedAt:Date.now(),order:plan.items.length+1});write50(plan);$50('v73150-player').value='';status50(`${p.name} adicionado ao plano de hoje.`,'ok');render50()}
function remove50(itemId){const plan=read50(),item=plan.items.find(i=>i.id===itemId);if(!item)return;if(!confirm('Remover este atleta do plano de hoje?'))return;plan.items=plan.items.filter(i=>i.id!==itemId);write50(plan);render50()}
function tomorrow50(itemId){const today=read50(),item=today.items.find(i=>i.id===itemId);if(!item)return;const d=new Date();d.setDate(d.getDate()+1);const tomorrow=date50(d),next=read50(tomorrow);if(!next.items.some(i=>String(i.playerId)===String(item.playerId)))next.items.push({...item,id:`p-${Date.now()}-${Math.random().toString(16).slice(2,6)}`,addedAt:Date.now(),order:next.items.length+1});write50(next);today.items=today.items.filter(i=>i.id!==itemId);today.deferred=today.deferred||[];today.deferred.push({...item,deferredAt:Date.now(),to:tomorrow});write50(today);render50();status50('Atleta adiado para amanhã.','ok')}
function open50(playerId){const p=player50(playerId);if(!p)return;try{currentId=String(p.id);updateGlobalSelect?.();setTab?.('report');setProfileTab?.('evaluations');loadPlayer?.(currentId);setTimeout(()=>openEvaluationModal?.(),90)}catch(e){console.error(e)}}
function next50(){const plan=read50(),item=plan.items.find(i=>{const p=player50(i.playerId);return p&&!done50(p)});if(item)return open50(item.playerId);const btn=$50('v73145-next');if(btn&&btn.dataset.v73150Fallback==='1')return;try{const auto=document.querySelector('#v73145-analysis-list .v73145-row:not(.done) button');if(auto)auto.click();else showToast?.('Plano concluído','Não há análises manuais pendentes hoje.','success')}catch(_){}}
async function copySummary50(){const plan=read50(),items=plan.items.filter(i=>player50(i.playerId)),done=items.filter(i=>done50(player50(i.playerId))).length,pending=items.length-done,deferred=(plan.deferred||[]).length,autoRemain=Number($50('v73145-k-remain')?.textContent)||0,missing=Number($50('v73145-k-missing')?.textContent)||0,allDone=players50().filter(done50).length;const text=`SCOUT INTELLIGENCE — RESUMO DO DIA ${new Date().toLocaleDateString('pt-BR')}\nMinha agenda: ${items.length} planejados • ${done} concluídos • ${pending} pendentes • ${deferred} adiados\nFila sugerida ainda pendente: ${autoRemain}\nAnálises registradas hoje: ${allDone}\nFichas com dados pendentes: ${missing}`;try{await navigator.clipboard.writeText(text);showToast?.('Resumo do dia copiado','Inclui sua agenda manual e a fila sugerida.','success')}catch(_){alert(text)}}
function close50(){const plan=read50();if(plan.closedAt){plan.closedAt=null;write50(plan);render50();status50('Dia reaberto para planejamento.','ok');return}const rows=plan.items.map(i=>player50(i.playerId)).filter(Boolean),done=rows.filter(done50).length,pending=rows.length-done,deferred=(plan.deferred||[]).length;const text=`Fechamento do dia\nPlanejados: ${rows.length}\nConcluídos: ${done}\nPendentes: ${pending}\nAdiados: ${deferred}`;if(!confirm(`${text}\n\nEncerrar o plano de hoje?`))return;plan.closedAt=Date.now();write50(plan);try{navigator.clipboard?.writeText(`SCOUT INTELLIGENCE — FECHAMENTO ${new Date().toLocaleDateString('pt-BR')}\n${text}`)}catch(_){}render50();status50('Plano encerrado. Resumo copiado quando o navegador permitiu.','ok')}
function status50(text,kind=''){const el=$50('v73150-status');if(el){el.textContent=text;el.className=`v73150-status ${kind}`}}
function rowHtml50(item){const p=player50(item.playerId);if(!p)return'';const done=done50(p),m=material50(p),pos=POS50[pos50(p)]||pos50(p),pri=priorityLabel50(item.priority),last=lastEval50(p),days=last?Math.floor((Date.now()-last)/86400000):null;const img=image50(p);return `<div class="v73150-row ${done?'done':''} ${item.priority==='high'?'high':item.priority==='low'?'low':''}">${img?`<img class="v73150-avatar" src="${esc50(img)}" alt="">`:`<div class="v73150-avatar" style="display:grid;place-items:center;font-weight:900">${esc50((p.name||'?').slice(0,1).toUpperCase())}</div>`}<div class="v73150-copy"><strong>${done?'✓ ':''}${esc50(p.name||'Atleta')}</strong><small>${esc50(pos)} • ${esc50(p.club||'Sem clube')} • ${esc50(reasonLabel50(item.reason))}${days==null?' • sem avaliação':` • última há ${days}d`}</small><div class="v73150-tags"><span class="v73150-chip pri">Prioridade ${esc50(pri)}</span>${m.full?'<span class="v73150-chip ok">✓ jogo completo</span>':''}${m.hl?'<span class="v73150-chip ok">✓ highlights</span>':''}${!m.video?'<span class="v73150-chip bad">⚠ sem vídeo</span>':''}${m.src?'<span class="v73150-chip ok">✓ fonte</span>':'<span class="v73150-chip warn">⚠ sem fonte</span>'}</div></div><div class="v73150-row-actions">${done?'<span class="v73150-chip ok">Concluído hoje</span>':`<button class="btn btn-primary" type="button" onclick="v73150Open('${esc50(item.playerId)}')">Analisar</button>`}<button class="btn btn-outline" type="button" onclick="v73150Tomorrow('${esc50(item.id)}')">Amanhã</button><button class="btn btn-outline" type="button" onclick="v73150Remove('${esc50(item.id)}')">Remover</button></div></div>`}
function render50(){const host=$50('v73150-list');if(!host)return;const plan=read50(),items=plan.items.filter(i=>player50(i.playerId)),done=items.filter(i=>done50(player50(i.playerId))).length,pending=items.length-done,deferred=(plan.deferred||[]).length,pct=items.length?Math.round(done/items.length*100):0;$50('v73150-k-plan').textContent=items.length;$50('v73150-k-done').textContent=done;$50('v73150-k-pending').textContent=pending;$50('v73150-k-deferred').textContent=deferred;$50('v73150-fill').style.width=`${pct}%`;$50('v73150-progress-text').textContent=items.length?`${done} de ${items.length} concluídos • faltam ${pending}`:'Monte sua agenda escolhendo posição e atleta.';$50('v73150-progress-pct').textContent=`${pct}%`;host.innerHTML=items.length?items.map(rowHtml50).join(''):'<div class="v73150-empty">Nenhum atleta definido por você para hoje. Use os campos acima ou peça uma sugestão do Scout.</div>';const closed=$50('v73150-closed');if(closed){closed.classList.toggle('show',!!plan.closedAt);closed.textContent=plan.closedAt?`✓ Plano encerrado às ${new Date(plan.closedAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}. Você pode reabrir se necessário.`:''}const close=$50('v73150-close');if(close)close.textContent=plan.closedAt?'Reabrir dia':'Encerrar dia';const add=$50('v73150-add');if(add)add.disabled=!!plan.closedAt;fillPlayers50();renameSuggested50();patchHero50()}
function renameSuggested50(){const list=$50('v73145-analysis-list');const panel=list?.closest('.v73145-panel');if(panel){const h=panel.querySelector('h3'),sub=panel.querySelector('.v73145-panel-sub');if(h)h.textContent='🤖 Fila sugerida pelo Scout';if(sub)sub.textContent='Sugestões automáticas por jogos sem avaliação, tarefas e tempo sem observação. Sua agenda manual acima tem prioridade.'}}
function patchHero50(){const next=$50('v73145-next');if(next){next.textContent='▶ Analisar próximo';next.onclick=next50;next.dataset.v73150='1'}const copy=$50('v73145-copy');if(copy){copy.textContent='Copiar resumo do dia';copy.onclick=copySummary50}const intro=document.querySelector('#tab-dashboard .page-intro p');if(intro)intro.textContent='Minha agenda, sugestões automáticas, pendências de dados, jogos e progresso do dia.'}
function install50(){const home=$50('v73145-home');if(!home||$50('v73150-card'))return false;const hero=home.querySelector('.v73145-hero'),grid=home.querySelector('.v73145-grid2');const card=document.createElement('section');card.id='v73150-card';card.className='v73150-card';card.innerHTML=`<div class="v73150-head"><div><h3>🎯 Plano de Análises do Dia</h3><p>Escolha quem você quer observar hoje. Sua agenda é separada da fila automática e fica fixa até você concluir, adiar ou remover.</p></div><div class="v73150-actions"><button class="btn btn-outline" id="v73150-close" type="button">Encerrar dia</button></div></div><div class="v73150-kpis"><div class="v73150-kpi"><span>Planejados</span><strong id="v73150-k-plan">0</strong></div><div class="v73150-kpi"><span>Concluídos</span><strong id="v73150-k-done">0</strong></div><div class="v73150-kpi"><span>Pendentes</span><strong id="v73150-k-pending">0</strong></div><div class="v73150-kpi"><span>Adiados</span><strong id="v73150-k-deferred">0</strong></div></div><div class="v73150-progress"><div class="v73150-progress-head"><span id="v73150-progress-text">Monte sua agenda.</span><b id="v73150-progress-pct">0%</b></div><div class="v73150-track"><div class="v73150-fill" id="v73150-fill" style="width:0%"></div></div></div><div class="v73150-closed" id="v73150-closed"></div><div class="v73150-planner"><select class="input-field" id="v73150-pos">${Object.entries(POS50).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select class="input-field" id="v73150-player"><option value="">Selecione o atleta...</option></select><select class="input-field" id="v73150-reason">${Object.entries(REASONS50).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select class="input-field" id="v73150-priority"><option value="high">Prioridade alta</option><option value="normal" selected>Prioridade normal</option><option value="low">Prioridade baixa</option></select><button class="btn btn-outline" id="v73150-suggest" type="button">Sugerir atleta</button><button class="btn btn-primary" id="v73150-add" type="button">＋ Adicionar</button></div><div class="v73150-status" id="v73150-status"></div><div class="v73150-list" id="v73150-list"></div>`;if(grid)home.insertBefore(card,grid);else hero?.after(card);$50('v73150-pos').addEventListener('change',fillPlayers50);$50('v73150-suggest').onclick=suggest50;$50('v73150-add').onclick=add50;$50('v73150-close').onclick=close50;fillPlayers50();render50();cloudHydrate50();return true}
function brand50(){try{document.title='Scout Intelligence 1.3.1.50 — V73.1.50 PLANEJAMENTO DIÁRIO';const v=document.querySelector('.sidebar-brand-version');if(v)v.textContent='V73.1.50 • Scout Intelligence 1.3.1.50';const sys=$50('system-release-status');if(sys)sys.textContent='V73.1.50 • Planejamento diário de scouting';const card=$50('v73144-stable-card');if(card){const h=card.querySelector('h3');if(h)h.textContent='🏁 V73.1.50 — Gate STABLE';const b=$50('v73144-promote');if(b)b.textContent='Promover V73.1.50 como STABLE'}}catch(_){} }
window.v73150Add=add50;window.v73150Remove=remove50;window.v73150Tomorrow=tomorrow50;window.v73150Open=open50;window.v73150Render=render50;window.v73150Suggest=suggest50;
const oldRender50=window.v73145RenderHome;if(typeof oldRender50==='function')window.v73145RenderHome=function(){const r=oldRender50.apply(this,arguments);setTimeout(()=>{install50();render50()},0);return r};
const oldTab50=window.setTab;if(typeof oldTab50==='function')window.setTab=function(name){const r=oldTab50.apply(this,arguments);if(name==='dashboard')setTimeout(()=>{install50();render50()},40);return r};
[180,600,1300,2600].forEach(ms=>setTimeout(()=>{brand50();install50();render50()},ms));setInterval(()=>{brand50();if(!$50('tab-dashboard')?.classList.contains('hidden')){install50();render50()}},60000);window.addEventListener('focus',()=>{if(!$50('tab-dashboard')?.classList.contains('hidden'))render50()});
})();
</script>
