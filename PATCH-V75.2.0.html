<script id="v752-script">
(()=>{
'use strict';
const VER='V75.2.0',APP='1.5.2.0',BUILD='2026.09.22-V75.2.0-MARKET-SEASONS-MEETINGS';
const $=id=>document.getElementById(id),clean=v=>String(v??'').replace(/\s+/g,' ').trim(),fold=v=>clean(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),esc=v=>clean(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const POS={GR:'Goleiro',ZAG:'Zagueiro',LAT:'Lateral',VOL:'Volante',MEI:'Meia',EXT:'Extremo',CA:'Centroavante'};
const STATUS={to_analyze:'Para analisar',analysis:'Em análise',decision:'Aguardando decisão',deepen:'Aprofundar',monitor:'Monitorar',approved:'Aprovado',hired:'Contratado',discarded:'Descartado'};
const ACTIONS={maintain:'Manter na lista',new_game:'Pedir novo jogo',advance_contact:'Avançar contato',wait:'Aguardar / monitorar',end:'Encerrar análise'};
let observer=null,cloudLoaded=false,selectedMeeting='';
function workspace(){try{return clean(typeof getWorkspaceOwnerUid==='function'?getWorkspaceOwnerUid():'')||clean(globalThis.currentUser?.uid)||'local'}catch(_){return'local'}}
function key(){return`scout_v750_recruitment_${workspace()}`}
function read(){let s={};try{s=JSON.parse(localStorage.getItem(key())||'{}')||{}}catch(_){};if(!Array.isArray(s.entries))s.entries=[];if(!Array.isArray(s.needs))s.needs=[];if(!s.dna||typeof s.dna!=='object')s.dna={};if(!s.shortlists||typeof s.shortlists!=='object')s.shortlists={};if(!Array.isArray(s.marketSeasons))s.marketSeasons=[];if(!Array.isArray(s.marketMeetings))s.marketMeetings=[];if(!s.marketSeasonActive||typeof s.marketSeasonActive!=='object')s.marketSeasonActive={};return s}
function write(s){s.updatedAt=Date.now();localStorage.setItem(key(),JSON.stringify(s));return s}
function players(){try{return Array.isArray(db)?db:[]}catch(_){return[]}}
function player(id){return players().find(p=>String(p.id)===String(id))||null}
function teams(){try{const a=JSON.parse(localStorage.getItem('scout_v73142_tracked_teams')||'[]');return Array.isArray(a)?a.filter(x=>x&&clean(x.name)):[]}catch(_){return[]}}
function activeClub(){const names=teams().map(x=>clean(x.name)),saved=localStorage.getItem('scout_v751_active_club')||localStorage.getItem('scout_v750_team')||localStorage.getItem('scout_v73140_team')||'';return names.find(x=>fold(x)===fold(saved))||names[0]||''}
function teamMeta(team){return teams().find(x=>fold(x.name)===fold(team))||{name:team}}
function posCode(p){const f=fold(p?.pos||p||'');if(/goleir|keeper|\bgr\b/.test(f))return'GR';if(/zagueir|central|center.?back|centre.?back/.test(f))return'ZAG';if(/lateral|ala|full.?back|wing.?back/.test(f))return'LAT';if(/volante|medio defens|defensive mid|holding/.test(f))return'VOL';if(/meia|meio.?camp|midfield|armador/.test(f))return'MEI';if(/ponta|extremo|winger|atacante de lado/.test(f))return'EXT';if(/centroav|atacante central|striker|\bca\b/.test(f))return'CA';return''}
function uid(prefix){return`${prefix}_${Date.now()}_${Math.random().toString(36).slice(2,8)}`}
function seasons(team){return read().marketSeasons.filter(x=>x.team===team).sort((a,b)=>Number(b.year||0)-Number(a.year||0)||Number(b.createdAt||0)-Number(a.createdAt||0))}
function activeSeason(team){const s=read(),id=s.marketSeasonActive?.[team],arr=seasons(team);return arr.find(x=>x.id===id)||arr.find(x=>x.status==='open')||arr[0]||null}
function teamEntries(team){return read().entries.filter(e=>e.team===team&&player(e.playerId))}
function teamNeeds(team){return read().needs.filter(n=>n.team===team)}
function snapshotEntry(e){const p=player(e.playerId);return{entryId:e.id,playerId:String(e.playerId),playerName:clean(p?.name)||'Atleta',club:clean(p?.club)||'',position:posCode(p),status:e.status||'to_analyze',priority:e.priority||'medium',needId:e.needId||'',nextAction:e.nextAction||'',capturedAt:Date.now()}}
function snapshotNeed(n){return{id:n.id,position:n.position,title:n.title||'',slots:Number(n.slots)||1,priority:n.priority||'normal',subprofile:n.subprofile||'',notes:n.notes||''}}
function syncSeason(s,season){if(!season||season.status!=='open'||season.autoInclude===false)return false;const es=teamEntries(season.team),ns=teamNeeds(season.team),before=`${(season.entryIds||[]).join('|')}#${(season.needIds||[]).join('|')}`;season.entryIds=[...new Set([...(season.entryIds||[]),...es.map(x=>x.id)])];season.needIds=[...new Set([...(season.needIds||[]),...ns.map(x=>x.id)])];season.updatedAt=Date.now();return before!==`${season.entryIds.join('|')}#${season.needIds.join('|')}`}
function selectedSeasonData(team){const s=read(),season=activeSeason(team);if(!season)return{state:s,season:null,entries:[],needs:[]};let changed=syncSeason(s,season);if(changed){const i=s.marketSeasons.findIndex(x=>x.id===season.id);if(i>=0)s.marketSeasons[i]=season;write(s);cloudSave(s)}const entries=season.status==='closed'&&Array.isArray(season.snapshotEntries)?season.snapshotEntries:teamEntries(team).filter(e=>(season.entryIds||[]).includes(e.id)).map(snapshotEntry);const needs=season.status==='closed'&&Array.isArray(season.snapshotNeeds)?season.snapshotNeeds:teamNeeds(team).filter(n=>(season.needIds||[]).includes(n.id)).map(snapshotNeed);return{state:s,season,entries,needs}}
function seasonCounts(entries){const c={};Object.keys(STATUS).forEach(k=>c[k]=entries.filter(e=>e.status===k).length);return c}
function ensureModals(){if(!$('v752-season-modal')){const d=document.createElement('div');d.innerHTML=`<div class="v752-modal" id="v752-season-modal"><div class="v752-modal-card"><div class="v752-modal-head"><div><h3>🗓️ Nova temporada de mercado</h3><p>Cria uma janela histórica para o clube. Enquanto estiver aberta, novos candidatos e necessidades podem entrar automaticamente.</p></div><button class="v750-close" type="button" onclick="v752CloseModal('v752-season-modal')">×</button></div><div class="v752-modal-grid"><div><label>Ano</label><input class="input-field" id="v752-season-year" type="number" min="2020" max="2100"></div><div><label>Nome</label><input class="input-field" id="v752-season-name" placeholder="Ex.: Mercado 2027"></div><div class="wide"><label>Observação</label><textarea class="input-field" id="v752-season-notes" style="min-height:80px" placeholder="Objetivos, janela, categoria ou contexto..."></textarea></div><label class="wide" style="display:flex;gap:8px;align-items:center;text-transform:none"><input type="checkbox" id="v752-season-current" checked> Incluir a lista atual e manter novos candidatos/necessidades sincronizados enquanto a temporada estiver aberta.</label></div><div class="v752-modal-foot"><button class="btn btn-outline" type="button" onclick="v752CloseModal('v752-season-modal')">Cancelar</button><button class="btn btn-primary" type="button" onclick="v752SaveSeason()">Criar temporada</button></div></div></div>`;document.body.appendChild(d.firstElementChild)}if(!$('v752-meeting-modal')){const d=document.createElement('div');d.innerHTML=`<div class="v752-modal" id="v752-meeting-modal"><div class="v752-modal-card"><div class="v752-modal-head"><div><h3>📅 Nova reunião de mercado</h3><p>Congela a shortlist e o contexto desta pauta. As decisões só alteram o Board quando você mandar aplicar.</p></div><button class="v750-close" type="button" onclick="v752CloseModal('v752-meeting-modal')">×</button></div><div class="v752-modal-grid"><div><label>Data</label><input class="input-field" id="v752-meeting-date" type="date"></div><div><label>Hora</label><input class="input-field" id="v752-meeting-time" type="time"></div><div class="wide"><label>Título</label><input class="input-field" id="v752-meeting-title" placeholder="Ex.: Reunião de Mercado — Volantes"></div><div class="wide"><label>Pauta / observação</label><textarea class="input-field" id="v752-meeting-notes" style="min-height:85px"></textarea></div><label class="wide" style="display:flex;gap:8px;align-items:center;text-transform:none"><input type="checkbox" id="v752-meeting-fallback" checked> Se a shortlist estiver vazia, usar os candidatos ativos da temporada.</label></div><div class="v752-modal-foot"><button class="btn btn-outline" type="button" onclick="v752CloseModal('v752-meeting-modal')">Cancelar</button><button class="btn btn-primary" type="button" onclick="v752SaveMeeting()">Criar reunião</button></div></div></div>`;document.body.appendChild(d.firstElementChild)}}
function openSeason(){ensureModals();const team=activeClub();if(!team)return alert('Selecione um clube.');const meta=teamMeta(team),guess=Number(String(meta.season||'').match(/20\d{2}/)?.[0])||new Date().getFullYear()+1;$('v752-season-year').value=guess;$('v752-season-name').value=`Mercado ${guess}`;$('v752-season-notes').value='';$('v752-season-current').checked=true;$('v752-season-modal').classList.add('open')}
function saveSeason(){const team=activeClub(),year=Number($('v752-season-year').value)||new Date().getFullYear(),name=clean($('v752-season-name').value)||`Mercado ${year}`,s=read(),now=Date.now(),include=$('v752-season-current').checked,es=include?teamEntries(team):[],ns=include?teamNeeds(team):[];const season={id:uid('season'),team,year,name,notes:clean($('v752-season-notes').value).slice(0,1800),status:'open',autoInclude:include,entryIds:es.map(x=>x.id),needIds:ns.map(x=>x.id),createdAt:now,updatedAt:now,createdBy:clean(globalThis.currentUser?.displayName||globalThis.currentUser?.email||'Scout')};s.marketSeasons.unshift(season);s.marketSeasonActive[team]=season.id;write(s);cloudSave(s);$('v752-season-modal').classList.remove('open');renderMarket();showToast?.('Temporada de mercado criada',`${team} • ${name}`,'success',5000)}
function chooseSeason(id){const team=activeClub(),s=read();if(id)s.marketSeasonActive[team]=id;else delete s.marketSeasonActive[team];write(s);renderMarket()}
function closeSeason(){const team=activeClub(),s=read(),season=activeSeason(team);if(!season||season.status==='closed')return;if(!confirm(`Encerrar ${season.name}? A lista, necessidades e status atuais serão congelados para histórico.`))return;syncSeason(s,season);season.status='closed';season.autoInclude=false;season.closedAt=Date.now();season.updatedAt=Date.now();season.snapshotEntries=teamEntries(team).filter(e=>(season.entryIds||[]).includes(e.id)).map(snapshotEntry);season.snapshotNeeds=teamNeeds(team).filter(n=>(season.needIds||[]).includes(n.id)).map(snapshotNeed);const i=s.marketSeasons.findIndex(x=>x.id===season.id);s.marketSeasons[i]=season;write(s);cloudSave(s);renderMarket();showToast?.('Temporada encerrada',`${season.name} foi congelada para histórico.`,'success',5500)}
function reopenSeason(){const team=activeClub(),s=read(),season=activeSeason(team);if(!season||season.status!=='closed')return;if(!confirm(`Reabrir ${season.name}? O snapshot histórico deixa de ser definitivo até novo encerramento.`))return;season.status='open';season.autoInclude=true;season.closedAt=0;season.snapshotEntries=[];season.snapshotNeeds=[];season.updatedAt=Date.now();const i=s.marketSeasons.findIndex(x=>x.id===season.id);s.marketSeasons[i]=season;write(s);cloudSave(s);renderMarket()}
function syncNow(){const team=activeClub(),s=read(),season=activeSeason(team);if(!season)return alert('Crie ou selecione uma temporada.');if(season.status==='closed')return alert('A temporada está encerrada. Reabra antes de sincronizar.');season.entryIds=[...new Set([...(season.entryIds||[]),...teamEntries(team).map(e=>e.id)])];season.needIds=[...new Set([...(season.needIds||[]),...teamNeeds(team).map(n=>n.id)])];season.updatedAt=Date.now();const i=s.marketSeasons.findIndex(x=>x.id===season.id);s.marketSeasons[i]=season;write(s);cloudSave(s);renderMarket();showToast?.('Temporada sincronizada','A lista atual do clube foi vinculada à temporada.','success',4500)}
function currentShortlist(team){const s=read(),map=s.shortlists?.[team]||{};return Object.entries(map).map(([pid,v])=>({pid:String(pid),slot:v?.slot||'watch'})).filter(x=>player(x.pid))}
function openMeeting(){ensureModals();const team=activeClub();if(!team)return alert('Selecione um clube.');const season=activeSeason(team),d=new Date();$('v752-meeting-date').value=d.toISOString().slice(0,10);$('v752-meeting-time').value=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;$('v752-meeting-title').value=`Reunião de Mercado${season?` — ${season.name}`:''}`;$('v752-meeting-notes').value='';$('v752-meeting-fallback').checked=true;$('v752-meeting-modal').classList.add('open')}
function saveMeeting(){const team=activeClub(),s=read(),season=activeSeason(team),short=currentShortlist(team);let list=short.map(x=>{const e=s.entries.find(e=>e.team===team&&String(e.playerId)===x.pid),p=player(x.pid);return{playerId:x.pid,playerName:clean(p?.name)||'Atleta',club:clean(p?.club)||'',position:posCode(p),slot:x.slot,status:e?.status||'',entryId:e?.id||'',needId:e?.needId||''}});if(!list.length&&$('v752-meeting-fallback').checked){const pool=season?selectedSeasonData(team).entries:teamEntries(team).map(snapshotEntry);list=pool.filter(x=>!['discarded','hired'].includes(x.status)).map(x=>({playerId:String(x.playerId),playerName:x.playerName,club:x.club,position:x.position,slot:'watch',status:x.status,entryId:x.entryId||'',needId:x.needId||''}))}if(!list.length)return alert('Não há candidatos para esta reunião. Monte a shortlist ou adicione candidatos à temporada.');const now=Date.now(),meeting={id:uid('meeting'),team,seasonId:season?.id||'',seasonName:season?.name||'',title:clean($('v752-meeting-title').value)||'Reunião de Mercado',date:$('v752-meeting-date').value,time:$('v752-meeting-time').value,notes:clean($('v752-meeting-notes').value).slice(0,2500),status:'open',snapshot:list,decisions:{},createdAt:now,updatedAt:now,createdBy:clean(globalThis.currentUser?.displayName||globalThis.currentUser?.email||'Scout')};s.marketMeetings.unshift(meeting);write(s);cloudSave(s);selectedMeeting=meeting.id;$('v752-meeting-modal').classList.remove('open');renderMarket();showToast?.('Reunião criada',`${meeting.title} • ${list.length} atleta(s)`,'success',5000)}
function meetings(team){return read().marketMeetings.filter(m=>m.team===team).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||Number(b.createdAt||0)-Number(a.createdAt||0))}
function saveMeetingDecisions(id){const s=read(),m=s.marketMeetings.find(x=>x.id===id);if(!m||m.status==='closed')return;const decisions={...(m.decisions||{})};(m.snapshot||[]).forEach(x=>{const a=$(`v752-action-${id}-${x.playerId}`),n=$(`v752-note-${id}-${x.playerId}`);if(a)decisions[x.playerId]={action:a.value||'maintain',note:clean(n?.value).slice(0,900),updatedAt:Date.now(),by:clean(globalThis.currentUser?.displayName||globalThis.currentUser?.email||'Scout')}});m.decisions=decisions;m.updatedAt=Date.now();write(s);cloudSave(s);renderMarket();showToast?.('Decisões da reunião salvas','Nenhum status do Board foi alterado automaticamente.','success',4500)}
function applyMeeting(id){const s=read(),m=s.marketMeetings.find(x=>x.id===id);if(!m)return;if(!confirm('Aplicar as decisões registradas ao Board? Esta ação altera status/próxima ação somente conforme as decisões humanas desta reunião.'))return;const map={new_game:['deepen','Pedir novo jogo / nova observação'],advance_contact:['approved','Avançar contato'],wait:['monitor','Aguardar / seguir monitorando'],end:['discarded','Análise encerrada em reunião']};let changed=0;Object.entries(m.decisions||{}).forEach(([pid,d])=>{const rule=map[d.action];if(!rule)return;const idx=s.entries.findIndex(e=>e.team===m.team&&String(e.playerId)===String(pid));if(idx<0)return;s.entries[idx]={...s.entries[idx],status:rule[0],nextAction:d.note||rule[1],updatedAt:Date.now()};changed++;try{if(globalThis.currentUser&&typeof workspaceRootRef==='function')workspaceRootRef().collection('recruitmentBoard').doc(s.entries[idx].id).set(s.entries[idx],{merge:true}).catch(()=>{})}catch(_){}});m.appliedAt=Date.now();m.appliedCount=changed;m.updatedAt=Date.now();write(s);cloudSave(s);renderMarket();try{window.v750Render?.()}catch(_){}showToast?.('Decisões aplicadas',`${changed} vínculo(s) do Board atualizado(s).`,'success',5500)}
function closeMeeting(id){const s=read(),m=s.marketMeetings.find(x=>x.id===id);if(!m||m.status==='closed')return;if(!confirm('Encerrar e congelar esta reunião? As decisões permanecerão registradas no histórico.'))return;m.status='closed';m.closedAt=Date.now();m.updatedAt=Date.now();write(s);cloudSave(s);renderMarket()}
function reopenMeeting(id){const s=read(),m=s.marketMeetings.find(x=>x.id===id);if(!m||m.status!=='closed')return;if(!confirm('Reabrir esta reunião para edição?'))return;m.status='open';m.closedAt=0;m.updatedAt=Date.now();write(s);cloudSave(s);renderMarket()}
function renderMeetingDetail(m){if(!m)return'<div class="v751-empty">Selecione ou crie uma reunião.</div>';const locked=m.status==='closed',dec=m.decisions||{};return`<div class="v752-head"><div><h3>${esc(m.title)}</h3><p>${esc([m.date,m.time,m.seasonName,m.createdBy].filter(Boolean).join(' • '))}</p></div><span class="v752-status ${locked?'closed':'open'}">${locked?'Encerrada':'Aberta'}</span></div>${m.notes?`<div class="v752-frozen">${esc(m.notes)}</div>`:''}<div>${(m.snapshot||[]).map(x=>{const d=dec[x.playerId]||{};return`<div class="v752-candidate"><div class="v752-candidate-head"><div><strong>${esc(x.playerName)}</strong><small>${esc(POS[x.position]||x.position||'—')} • ${esc(x.club||'Clube n/i')} • ${esc(x.slot==='option1'?'Opção 1':x.slot==='option2'?'Opção 2':x.slot==='alternative'?'Alternativa':'Reserva')}</small></div><select class="input-field" id="v752-action-${esc(m.id)}-${esc(x.playerId)}" ${locked?'disabled':''}>${Object.entries(ACTIONS).map(([k,v])=>`<option value="${k}" ${(d.action||'maintain')===k?'selected':''}>${v}</option>`).join('')}</select></div><textarea class="input-field" id="v752-note-${esc(m.id)}-${esc(x.playerId)}" ${locked?'disabled':''} placeholder="Observação / próxima ação...">${esc(d.note||'')}</textarea></div>`}).join('')}</div><div class="v752-actions" style="margin-top:10px">${locked?`<button class="btn btn-outline" type="button" onclick="v752ReopenMeeting('${esc(m.id)}')">Reabrir</button>`:`<button class="btn btn-primary" type="button" onclick="v752SaveMeetingDecisions('${esc(m.id)}')">Salvar decisões</button><button class="btn btn-outline" type="button" onclick="v752ApplyMeeting('${esc(m.id)}')">Aplicar ao Board</button><button class="btn btn-outline" type="button" onclick="v752CloseMeeting('${esc(m.id)}')">Encerrar reunião</button>`}${m.appliedAt?`<span class="v751-chip info">Aplicada ao Board • ${m.appliedCount||0}</span>`:''}</div><div class="v752-mapnote">Manter não altera o Board. “Pedir novo jogo”, “Avançar contato”, “Aguardar” e “Encerrar análise” só alteram o vínculo quando você clicar em <b>Aplicar ao Board</b>.</div>`}
function renderMarket(){const host=$('v752-market'),team=activeClub();if(!host||!team)return;const data=selectedSeasonData(team),season=data.season,arr=seasons(team),c=seasonCounts(data.entries),ms=meetings(team);if(selectedMeeting&&!ms.some(x=>x.id===selectedMeeting))selectedMeeting='';if(!selectedMeeting&&ms[0])selectedMeeting=ms[0].id;const cur=ms.find(x=>x.id===selectedMeeting)||null;host.innerHTML=`<section class="v752-panel"><div class="v752-head"><div><h3>🗓️ Temporada de Mercado</h3><p>Separe o recrutamento por janela/ano. Ao encerrar, candidatos, necessidades e status ficam congelados como histórico.</p></div><div class="v752-actions"><button class="btn btn-primary" type="button" onclick="v752OpenSeason()">＋ Nova temporada</button>${season&&season.status==='open'?`<button class="btn btn-outline" type="button" onclick="v752SyncNow()">↻ Sincronizar lista</button><button class="btn btn-outline" type="button" onclick="v752CloseSeason()">🔒 Encerrar</button>`:season?`<button class="btn btn-outline" type="button" onclick="v752ReopenSeason()">↩ Reabrir</button>`:''}</div></div>${arr.length?`<div class="v752-seasonbar"><div class="v750-field"><label>Temporada ativa / histórica</label><select class="input-field" id="v752-season-select">${arr.map(x=>`<option value="${esc(x.id)}" ${season?.id===x.id?'selected':''}>${esc(x.name)} • ${x.status==='closed'?'encerrada':'aberta'}</option>`).join('')}</select></div><div>${season?`<span class="v752-status ${season.status==='closed'?'closed':'open'}">${season.status==='closed'?'Encerrada':'Aberta'}</span>`:''}</div></div><div class="v752-seasonmeta"><div class="v752-kpi"><span>Candidatos</span><strong>${data.entries.length}</strong></div><div class="v752-kpi"><span>Para analisar</span><strong>${c.to_analyze||0}</strong></div><div class="v752-kpi orange"><span>Aprofundar</span><strong>${c.deepen||0}</strong></div><div class="v752-kpi"><span>Monitorar</span><strong>${c.monitor||0}</strong></div><div class="v752-kpi green"><span>Aprovados</span><strong>${c.approved||0}</strong></div><div class="v752-kpi"><span>Necessidades</span><strong>${data.needs.length}</strong></div></div>${season?.notes?`<div class="v752-frozen" style="margin-top:9px">${esc(season.notes)}</div>`:''}`:'<div class="v751-empty">Nenhuma temporada criada. Para começar, crie por exemplo <b>Mercado 2027</b>.</div>'}</section><section class="v752-panel"><div class="v752-head"><div><h3>📅 Reuniões de Mercado</h3><p>Congele a shortlist de uma reunião, registre a decisão de cada atleta e aplique ao Board apenas quando confirmar.</p></div><div class="v752-actions"><button class="btn btn-primary" type="button" onclick="v752OpenMeeting()">＋ Nova reunião</button></div></div><div class="v752-meeting-grid"><div class="v752-meeting-list">${ms.length?ms.map(m=>`<div class="v752-meeting-item ${selectedMeeting===m.id?'active':''}" onclick="v752SelectMeeting('${esc(m.id)}')"><strong>${esc(m.title)}</strong><small>${esc([m.date,m.time,m.seasonName].filter(Boolean).join(' • '))} • ${m.snapshot?.length||0} atleta(s) • ${m.status==='closed'?'encerrada':'aberta'}</small></div>`).join(''):'<div class="v751-empty">Nenhuma reunião registrada para este clube.</div>'}</div><div class="v752-meeting-detail">${renderMeetingDetail(cur)}</div></div></section>`;const sel=$('v752-season-select');if(sel)sel.onchange=()=>chooseSeason(sel.value);decorateClubbarSeason(team,season)}
function decorateClubbarSeason(team,season){const bar=$('v751-clubbar');if(!bar)return;let tag=$('v752-club-season-tag');if(!tag){tag=document.createElement('div');tag.id='v752-club-season-tag';tag.className='v751-clubbar-meta';bar.appendChild(tag)}tag.innerHTML=`<strong>${esc(season?.name||'Sem temporada de mercado')}</strong>${season?`${season.status==='closed'?'Histórico encerrado':'Janela ativa'} • ${season.year||''}`:'Crie uma temporada para organizar o histórico.'}`}
async function cloudSave(s){if(!globalThis.currentUser||typeof workspaceRootRef!=='function')return;try{await workspaceRootRef().collection('recruitmentMarket').doc('main').set({marketSeasons:s.marketSeasons||[],marketMeetings:s.marketMeetings||[],marketSeasonActive:s.marketSeasonActive||{},updatedAt:Date.now()},{merge:true})}catch(e){console.warn('V75.2 market cloud:',e)}}
function mergeById(local,remote){const m=new Map((local||[]).map(x=>[x.id,x]));(remote||[]).forEach(x=>{const old=m.get(x.id);if(!old||Number(x.updatedAt||0)>=Number(old.updatedAt||0))m.set(x.id,x)});return[...m.values()]}
async function cloudLoad(){if(cloudLoaded||!globalThis.currentUser||typeof workspaceRootRef!=='function')return;cloudLoaded=true;try{const d=await workspaceRootRef().collection('recruitmentMarket').doc('main').get();if(d.exists){const r=d.data()||{},s=read();s.marketSeasons=mergeById(s.marketSeasons,r.marketSeasons);s.marketMeetings=mergeById(s.marketMeetings,r.marketMeetings);s.marketSeasonActive={...(r.marketSeasonActive||{}),...(s.marketSeasonActive||{})};write(s);renderMarket()}}catch(e){console.warn('V75.2 market cloud load:',e)}}
function ensureMarket(){const extras=$('v751-club-extras'),team=activeClub();if(!extras||!team)return;let host=$('v752-market');if(!host){host=document.createElement('div');host.id='v752-market';host.className='v752-market';extras.insertBefore(host,extras.firstChild);renderMarket();cloudLoad()}else if(host.dataset.team!==team){host.dataset.team=team;selectedMeeting='';renderMarket()}else if(!host.innerHTML.trim())renderMarket();host.dataset.team=team}
function observe(){const root=$('v750-root');if(!root||observer)return;let timer=0;observer=new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(()=>{if(!$('tab-recruitment-board')?.classList.contains('hidden'))ensureMarket()},120)});observer.observe(root,{childList:true,subtree:true})}
function branding(){try{document.title='Scout Intelligence 1.5.2.0 — V75.2.0 TEMPORADA DE MERCADO & REUNIÕES';const v=document.querySelector('.sidebar-brand-version');if(v)v.textContent='V75.2.0 • Scout Intelligence 1.5.2.0';const sys=$('system-release-status');if(sys)sys.textContent='V75.2.0 • Clube, Temporadas & Reuniões';const road=$('nav-roadmap')?.querySelector('.sidebar-label');if(road)road.textContent='V75.2 • Mercado';const gate=$('v73144-stable-card');if(gate){const h=gate.querySelector('h3');if(h)h.textContent='🏁 V75.2.0 — Gate de homologação';const b=$('v73144-promote');if(b)b.textContent='Promover V75.2.0 após homologação'}}catch(_){}}
window.v752OpenSeason=openSeason;window.v752SaveSeason=saveSeason;window.v752CloseSeason=closeSeason;window.v752ReopenSeason=reopenSeason;window.v752SyncNow=syncNow;window.v752OpenMeeting=openMeeting;window.v752SaveMeeting=saveMeeting;window.v752SelectMeeting=id=>{selectedMeeting=id;renderMarket()};window.v752SaveMeetingDecisions=saveMeetingDecisions;window.v752ApplyMeeting=applyMeeting;window.v752CloseMeeting=closeMeeting;window.v752ReopenMeeting=reopenMeeting;window.v752CloseModal=id=>$(id)?.classList.remove('open');
const baseRender=window.v750Render;if(typeof baseRender==='function'&&!baseRender.__v752){const wrap=function(){const r=baseRender.apply(this,arguments);setTimeout(ensureMarket,180);return r};wrap.__v752=true;window.v750Render=wrap}
const baseSet=window.setTab;if(typeof baseSet==='function'&&!baseSet.__v752){const wrap=function(name){const r=baseSet.apply(this,arguments);if(name==='recruitment-board')setTimeout(()=>{ensureMarket();cloudLoad()},300);return r};wrap.__v752=true;window.setTab=wrap}
try{if(typeof HOMOLOGATION_ITEMS!=='undefined'&&!HOMOLOGATION_ITEMS.some(i=>i.id==='market-season-v752')){HOMOLOGATION_ITEMS.push({id:'market-season-v752',title:'Temporada de Mercado V75.2',detail:'Criar Mercado 2027, sincronizar candidatos/necessidades, encerrar e conferir snapshot histórico.'});HOMOLOGATION_ITEMS.push({id:'market-meeting-v752',title:'Reunião de Mercado V75.2',detail:'Criar reunião, congelar shortlist, registrar decisões, aplicar ao Board e encerrar.'})}}catch(_){ }
ensureModals();[250,900,1800,3200].forEach(ms=>setTimeout(()=>{branding();observe();if(!$('tab-recruitment-board')?.classList.contains('hidden'))ensureMarket()},ms));setInterval(branding,550);
})();
</script>
