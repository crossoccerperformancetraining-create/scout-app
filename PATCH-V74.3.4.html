function urlSyntaxOk(v){if(!clean(v))return true;try{const u=new URL(v,location.href);return ['http:','https:'].includes(u.protocol)}catch(_){return false}}
function reportGate(p=currentPlayer()){
  if(!p)return{ready:false,blocked:1,warnings:0,checks:[{level:'bad',ok:false,label:'Atleta selecionado'}]};
  const ev=evaluations(p),incl=ev.filter(x=>x?.includeInPdf!==false),n=latestConfirmedNarrative(p),decision=clean(p.decision),videos=(()=>{try{return typeof normalizePlayerVideos==='function'?(normalizePlayerVideos(p)||[]):Array.isArray(p.videos)?p.videos:[]}catch(_){return[]}})(),sources=(()=>{try{return typeof getPlayerDataSources==='function'?(getPlayerDataSources(p)||[]):[]}catch(_){return[]}})(),urls=[...videos.map(x=>x.url),...sources.map(x=>x.url),p.extLink].filter(Boolean),badUrls=urls.filter(x=>!urlSyntaxOk(x)).length,confidence=(()=>{try{return Number(calculateDataConfidence(p))||0}catch(_){return 0}})();
  const checks=[
    {level:n.text?'ok':'bad',ok:!!n.text,label:'Parecer técnico confirmado'},
    {level:incl.length?'ok':'bad',ok:incl.length>0,label:'Ao menos uma avaliação incluída no PDF'},
    {level:decision&&fold(decision)!=='em analise'?'ok':'bad',ok:!!decision&&fold(decision)!=='em analise',label:'Decisão / encaminhamento definido'},
    {level:badUrls?'bad':'ok',ok:badUrls===0,label:badUrls?`${badUrls} link(s) com formato inválido`:'Links com formato válido'},
    {level:sources.length?'ok':'warn',ok:sources.length>0,label:sources.length?'Fonte de dados cadastrada':'Sem fonte de dados cadastrada'},
    {level:videos.length?'ok':'warn',ok:videos.length>0,label:videos.length?'Vídeo/recurso disponível':'Sem vídeo cadastrado'},
    {level:confidence>=60?'ok':'warn',ok:confidence>=60,label:`Confiança dos dados ${confidence}%`},
    {level:clean(p.funnelNextAction)?'ok':'warn',ok:!!clean(p.funnelNextAction),label:clean(p.funnelNextAction)?'Próxima ação definida':'Próxima ação ainda não definida'}
  ];
  const blocked=checks.filter(x=>x.level==='bad').length,warnings=checks.filter(x=>x.level==='warn').length;return{ready:blocked===0,blocked,warnings,checks,playerId:String(p.id)}
}
function ensureReportGate(){const tab=$('tab-report');if(!tab)return null;let box=$('v7434-report-gate');if(box)return box;box=document.createElement('section');box.id='v7434-report-gate';box.className='v7434-gate no-print';box.innerHTML=`<div class="v7434-gate-head"><strong>🛡️ Gate do relatório antes do PDF</strong><span class="v7434-gate-state" id="v7434-gate-state">Verificando</span></div><div class="v7434-gate-list" id="v7434-gate-list"></div><div class="v7434-gate-actions"><button class="btn btn-outline" type="button" onclick="v7434RenderReportGate()">↻ Atualizar gate</button><button class="btn btn-outline" type="button" onclick="v7434OpenMissingGate()">Corrigir pendências</button></div>`;const actions=tab.querySelector('.print-actions');if(actions)actions.insertAdjacentElement('afterend',box);else tab.prepend(box);return box}
function renderReportGate(){const box=ensureReportGate();if(!box)return;const g=reportGate(),st=$('v7434-gate-state'),list=$('v7434-gate-list');if(st){st.className=`v7434-gate-state ${g.ready?(g.warnings?'warn':'ready'):'blocked'}`;st.textContent=g.ready?(g.warnings?`PRONTO COM ${g.warnings} AVISO(S)`:'PRONTO PARA PDF'):`${g.blocked} BLOQUEIO(S)`}if(list)list.innerHTML=g.checks.map(x=>`<div class="v7434-gate-item ${x.level}">${x.level==='ok'?'✓':x.level==='warn'?'!':'✕'} ${esc(x.label)}</div>`).join('');const btn=[...($('tab-report')?.querySelectorAll('button')||[])].find(b=>/PDF Completo/i.test(b.textContent||''));if(btn&&!btn.dataset.v7434){btn.dataset.v7434='1';btn.onclick=printFullReport}}
function openMissingGate(){const g=reportGate();const bad=g.checks.filter(x=>x.level==='bad').map(x=>x.label);if(!bad.length)return alert('Sem bloqueios críticos. Revise apenas os avisos antes de emitir.');alert('Corrija antes de emitir o PDF:\n\n• '+bad.join('\n• '))}
function approveGateSnapshot(g){try{localStorage.setItem(`scout_v7434_report_gate_${workspaceId()}_${g.playerId}`,JSON.stringify({version:VER,at:Date.now(),by:actor(),blocked:g.blocked,warnings:g.warnings,checks:g.checks.map(x=>({level:x.level,label:x.label}))}))}catch(_){}}
function requireGate(action){const g=reportGate();renderReportGate();if(!g.ready){alert('O relatório possui bloqueios antes do PDF:\n\n'+g.checks.filter(x=>x.level==='bad').map(x=>'• '+x.label).join('\n'));return false}if(g.warnings&&!confirm(`O Gate está liberado, mas existem ${g.warnings} aviso(s). Deseja continuar sob revisão humana?`))return false;approveGateSnapshot(g);return true}
function printFullReport(){if(!requireGate('print'))return;window.print()}
const baseExecutivePdf=window.generateExecutivePdf;if(typeof baseExecutivePdf==='function'&&!baseExecutivePdf.__v7434){const wrap=async function(){if(!requireGate('executive-pdf'))return;return baseExecutivePdf.apply(this,arguments)};wrap.__v7434=true;window.generateExecutivePdf=wrap}
const baseOfficialCreate=window.createOfficialReportVersion;if(typeof baseOfficialCreate==='function'&&!baseOfficialCreate.__v7434){const wrap=async function(){if(!requireGate('official'))return;return baseOfficialCreate.apply(this,arguments)};wrap.__v7434=true;window.createOfficialReportVersion=wrap}

/* ---------- SAÚDE DO ANALYZER ---------- */
function bridgeCfg(){try{return{endpoint:'http://127.0.0.1:8765',token:'',...JSON.parse(localStorage.getItem(`scout_v743_bridge_cfg_${workspaceId()}`)||'{}')}}catch(_){return{endpoint:'http://127.0.0.1:8765',token:''}}}
function bridgeJobs(){try{const a=JSON.parse(localStorage.getItem(`scout_v743_bridge_jobs_${workspaceId()}`)||'[]');return Array.isArray(a)?a:[]}catch(_){return[]}}
function ensureAnalyzerHealth(){const tab=$('tab-video-audit'),anchor=$('v743-bridge-card')||tab?.querySelector('.v740-hero');if(!tab||!anchor)return null;let box=$('v7434-analyzer-health');if(box)return box;box=document.createElement('section');box.id='v7434-analyzer-health';box.className='v7434-health';box.innerHTML=`<div class="v7434-health-head"><div><h3>🩺 Saúde do Analyzer Local</h3><p>Estado da ponte Windows, fila local e contingência por JSON. Offline no iPad/celular é esperado quando o Analyzer está rodando no Windows.</p></div><span class="v7434-health-state" id="v7434-health-state">Verificando…</span></div><div class="v7434-health-grid"><div class="v7434-health-kpi"><span>Versão</span><strong id="v7434-health-version">—</strong></div><div class="v7434-health-kpi"><span>Aguardando</span><strong id="v7434-health-queued">0</strong></div><div class="v7434-health-kpi"><span>Em andamento</span><strong id="v7434-health-active">0</strong></div><div class="v7434-health-kpi"><span>Resultados prontos</span><strong id="v7434-health-ready">0</strong></div><div class="v7434-health-kpi"><span>Jobs no Scout</span><strong id="v7434-health-jobs">0</strong></div><div class="v7434-health-kpi"><span>Token</span><strong id="v7434-health-token">—</strong></div></div><div class="v7434-health-actions"><button class="btn btn-outline" type="button" onclick="v7434CheckAnalyzerHealth(true)">Testar agora</button><button class="btn btn-outline" type="button" onclick="window.v743BridgePoll?.(true)">Buscar resultado</button><button class="btn btn-outline" type="button" onclick="document.getElementById('v743-bridge-card')?.scrollIntoView({behavior:'smooth',block:'center'})">Configurar ponte</button></div><div class="v7434-health-note" id="v7434-health-note">O JSON manual permanece disponível como fallback.</div>`;anchor.insertAdjacentElement('afterend',box);return box}
async function checkAnalyzerHealth(show=false){const box=ensureAnalyzerHealth();if(!box)return false;const cfg=bridgeCfg(),st=$('v7434-health-state'),set=(id,v)=>{const e=$(id);if(e)e.textContent=v},jobs=bridgeJobs();set('v7434-health-jobs',jobs.filter(j=>!j.imported).length);set('v7434-health-token',cfg.token?'Configurado':'Não configurado');let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),3500);try{const r=await fetch(cfg.endpoint.replace(/\/$/,'')+'/health',{cache:'no-store',signal:controller.signal}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||`HTTP ${r.status}`);if(st){st.className='v7434-health-state online';st.textContent='● ONLINE'}set('v7434-health-version',j.analyzer_version||'V2.3');set('v7434-health-queued',j.queued_jobs||0);set('v7434-health-active',j.active_jobs||0);set('v7434-health-ready',j.ready_results||0);const note=$('v7434-health-note');if(note)note.textContent=`Última conexão: ${new Date().toLocaleString('pt-BR')} • endpoint ${cfg.endpoint}. ${j.ready_results?j.ready_results+' resultado(s) aguardando coleta.':'Nenhum resultado pendente agora.'}`;try{localStorage.setItem(`scout_v7434_analyzer_health_${workspaceId()}`,JSON.stringify({at:Date.now(),online:true,version:j.analyzer_version||'',queued:j.queued_jobs||0,active:j.active_jobs||0,ready:j.ready_results||0}))}catch(_){}if(show)showToast?.('Analyzer Local online',`${j.queued_jobs||0} aguardando • ${j.active_jobs||0} em andamento • ${j.ready_results||0} prontos`,'success',5000);return true}catch(e){if(st){st.className='v7434-health-state offline';st.textContent='○ OFFLINE / MANUAL'}set('v7434-health-version','—');set('v7434-health-queued','—');set('v7434-health-active','—');set('v7434-health-ready','—');const note=$('v7434-health-note');if(note)note.textContent='Ponte local não alcançada neste dispositivo. No Windows, abra o Analyzer e teste a ponte; no iPad/celular use Exportar tarefa / Importar JSON. '+clean(e.message);if(show)showToast?.('Analyzer não conectado','O fluxo manual por JSON continua disponível.','warning',5500);return false}finally{clearTimeout(timer)}}

function installAll(){ensureNextActionCard();renderNextAction();ensureHistoryPanel();renderTeamHistory();ensureMovementModal();renderReportGate();ensureAnalyzerHealth();if(!$('tab-video-audit')?.classList.contains('hidden'))checkAnalyzerHealth(false)}
function branding(){try{document.title='Scout Intelligence 1.4.3.4 — V74.3.4 FINAL OPERACIONAL';const v=document.querySelector('.sidebar-brand-version');if(v)v.textContent='V74.3.4 • Scout Intelligence 1.4.3.4';const sys=$('system-release-status');if(sys)sys.textContent='V74.3.4 • Elenco + próxima ação + Gate PDF + saúde Analyzer';const road=$('nav-roadmap')?.querySelector('.sidebar-label');if(road)road.textContent='V74.3 FINAL';const gate=$('v73144-stable-card');if(gate){const h=gate.querySelector('h3');if(h)h.textContent='🏁 V74.3.4 — Gate FINAL';const b=$('v73144-promote');if(b)b.textContent='Promover V74.3.4 após homologação'}}catch(_){}}
const baseTeamRender=window.renderTrackedTeamDashboard;if(typeof baseTeamRender==='function'&&!baseTeamRender.__v7434){const w=function(){const r=baseTeamRender.apply(this,arguments);setTimeout(()=>{renderTeamHistory();},90);return r};w.__v7434=true;window.renderTrackedTeamDashboard=w}
const baseSetTab=window.setTab;if(typeof baseSetTab==='function'&&!baseSetTab.__v7434){const w=function(name){const r=baseSetTab.apply(this,arguments);setTimeout(()=>{if(name==='report')renderReportGate();if(name==='squad-tracking')renderTeamHistory();if(name==='video-audit')checkAnalyzerHealth(false);renderNextAction()},100);return r};w.__v7434=true;window.setTab=w}
window.v7434QuickNext=quickNext;window.v7434OpenMovement=openMovement;window.v7434RenderTeamHistory=renderTeamHistory;window.v7434RenderReportGate=renderReportGate;window.v7434OpenMissingGate=openMissingGate;window.v7434PrintFullReport=printFullReport;window.v7434CheckAnalyzerHealth=checkAnalyzerHealth;window.v7434ReportGate=reportGate;
[120,500,1100,2300,4200].forEach(ms=>setTimeout(()=>{branding();installAll()},ms));setInterval(()=>{branding();renderNextAction();if(!$('tab-squad-tracking')?.classList.contains('hidden'))renderTeamHistory();if(!$('tab-report')?.classList.contains('hidden'))renderReportGate()},7000);setInterval(()=>{if(!$('tab-video-audit')?.classList.contains('hidden'))checkAnalyzerHealth(false)},15000);window.addEventListener('focus',()=>{branding();installAll()});
})();
