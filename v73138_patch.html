  /* Picker móvel próprio: a lista rola dentro do painel e não volta para o topo. */

  function selectPlayer(id){const p=(db||[]).find(x=>String(x.id)===String(id));if(!p)return;currentId=String(p.id);const native=document.getElementById('globalPlayerSelect');if(native)native.value=currentId;try{loadPlayer(currentId);}catch(_){}try{setTab('report');}catch(_){}closePicker();updateTrigger();requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'auto'}));}
  function renderPicker(){if(!picker)return;const list=picker.querySelector('.v73138-mobile-picker-list'),q=fold(query),players=(db||[]).filter(p=>!q||fold(`${p.name||''} ${p.pos||''} ${p.club||''}`).includes(q)).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'pt-BR'));if(!list)return;list.replaceChildren();if(!players.length){const empty=document.createElement('div');empty.className='v73138-no-results';empty.textContent='Nenhum atleta encontrado.';list.appendChild(empty);return;}const frag=document.createDocumentFragment();players.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='v73138-mobile-player-row';const img=document.createElement('img');try{if(typeof setSafeImage==='function')setSafeImage(img,p.photo,p.name||'Atleta');else img.src=p.photo||'';}catch(_){img.src=p.photo||'';}const copy=document.createElement('span');copy.className='v73138-mobile-player-copy';const name=document.createElement('strong');name.textContent=p.name||'Atleta';const meta=document.createElement('span');meta.textContent=[p.pos||'',p.club||''].filter(Boolean).join(' • ')||'Perfil do atleta';copy.append(name,meta);const arrow=document.createElement('b');arrow.textContent='›';b.append(img,copy,arrow);b.onclick=()=>selectPlayer(p.id);frag.appendChild(b);});list.appendChild(frag);}

  const oldUpdate=window.updateGlobalSelect;if(typeof oldUpdate==='function')window.updateGlobalSelect=function(){const r=oldUpdate.apply(this,arguments);ensureTrigger();updateTrigger();return r;};
  const oldLoad=window.loadPlayer;if(typeof oldLoad==='function')window.loadPlayer=function(){const r=oldLoad.apply(this,arguments);updateTrigger();return r;};
  [100,700,1600].forEach(ms=>setTimeout(()=>{ensureTrigger();updateTrigger();},ms));addEventListener('resize',()=>{ensureTrigger();if(!mobile())closePicker();},{passive:true});
  setTimeout(()=>{try{const badge=document.querySelector('.v7317-hub-badge');if(badge)badge.textContent='V73.1.38 • mobile estável + jogo completo ativo';}catch(_){}try{document.title='Scout Intelligence 1.3.1.38 — V73.1.38';}catch(_){}},900);
